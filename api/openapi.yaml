openapi: 3.1.0
info:
  title: Doorstep Core API
  version: 0.1.0
  summary: Contract between the Doorstep app, console, public pages and the core API.
  description: |
    Source of truth for every client ↔ core API interaction. Change this file first, then regenerate
    client types. The vault has its own contract (`vault.yaml`) and is reachable only from the core API.

    ## Conventions
    - JSON bodies, `camelCase` fields. Domain enum values are `lower_snake` (matching the design doc);
      error codes are `UPPER_SNAKE`.
    - IDs are UUIDs. IDs of anything a client can create offline (structures, entrances, units, traces,
      photos, service records, grievances) are **generated by the client** so offline records can reference
      each other. Structure **codes** are never client-generated.
    - Geometry is GeoJSON (`[lon, lat]`). A single GPS reading is a `Fix` (with accuracy).
    - Times are RFC 3339 UTC. Device-reported times (`capturedAt`, `pressedAt`) are stored as reported and
      never used for ordering (SY-08); ordering uses server receipt and per-device sequence.
    - Lists are cursor-paginated: `?cursor=&limit=` → `{ data, nextCursor }`. `nextCursor: null` means done.
    - Roles allowed per operation are listed in `x-roles`. Edge cases an operation must satisfy are listed
      in `x-edge-cases`; tests are named after them.

    ## Errors
    Every non-2xx response is an `Error`. `message` is safe to show to users and never contains personal
    data, stack traces or vault fields (PV-08). Clients switch on `code`, never on `message`.

    ## Idempotency
    - Sync operations are idempotent by `clientOpId` (per device).
    - Every other `POST` that creates or changes state requires an `Idempotency-Key` header, generated
      **once per user intent** by the client and reused on every retry of that intent.
    - The server claims the key with a unique constraint before acting. A replay returns the original
      status and body with `Idempotent-Replayed: true`. The same key with a different body returns `422
      IDEMPOTENCY_KEY_REUSED`. A duplicate arriving while the first is still running returns `409
      IDEMPOTENCY_IN_FLIGHT`; clients retry after a short delay.
    - Keys and sync operation results are kept for the life of the deployment (devices can be offline for
      days; pilot scale makes this cheap).

    ## Live events
    Staff clients get a ticket from `POST /live/tickets`, then open `GET /live` as a WebSocket. Every event
    carries a monotonic integer `cursor`. On (re)connect the client sends its last cursor and the server
    replays every later event before streaming new ones. `GET /events` serves the same stream over REST.
    See `LiveEvent` and `LiveServerMessage`.
servers:
  - url: "{baseUrl}/api/v1"
    variables:
      baseUrl:
        default: http://localhost:8000
        description: Changes on every Quick Tunnel restart; apps get it by scanning the console QR (SY-15).

security:
  - staffAuth: []

tags:
  - name: auth
  - name: devices
  - name: residents
  - name: zones
  - name: sync
  - name: photos
  - name: registry
  - name: review
  - name: graph
  - name: tasks
  - name: grievances
  - name: incidents
  - name: consent
  - name: public
  - name: live
  - name: imagery
  - name: admin

paths:
  # ---------------------------------------------------------------- auth
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Staff login (admin, reviewer, dispatcher, mapper)
      security: []
      x-edge-cases: [AC-01, AC-02]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Exchange a refresh token for a new session
      description: |
        Refresh tokens are long-lived so a mapper offline for days can refresh on reconnect (SY-02).
        `401 REFRESH_EXPIRED` means the app must prompt for the password; queued data is kept.
      security: []
      x-edge-cases: [SY-02, AC-02, AC-04]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New session (role reflects the account's current role)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current refresh token
      x-roles: [admin, reviewer, dispatcher, mapper]
      responses:
        "204": { description: Logged out }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current account (role is read fresh on every request)
      x-roles: [admin, reviewer, dispatcher, mapper]
      x-edge-cases: [AC-04]
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /config:
    get:
      tags: [auth]
      operationId: getClientConfig
      summary: Runtime settings clients cache for offline use
      security: [{ staffAuth: [] }, { residentAuth: [] }]
      x-edge-cases: [DS-20, GP-01]
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientConfig" }

  # ---------------------------------------------------------------- devices
  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - { name: accountId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Device" } }
    post:
      tags: [devices]
      operationId: registerDevice
      summary: Register the mapper's phone (client-generated device ID); idempotent on deviceId
      x-roles: [mapper, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, label]
              properties:
                deviceId: { type: string, format: uuid }
                label: { type: string, maxLength: 60 }
                appVersion: { type: string }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "200":
          description: Already registered to this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "409": { $ref: "#/components/responses/Conflict" }

  /devices/{deviceId}/revoke:
    post:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device; the response lists what was unsynced on it at last report
      x-roles: [admin]
      x-edge-cases: [SY-14, PV-06, RS-02]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Revoked (idempotent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceRevocation" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- residents
  /residents/claims:
    post:
      tags: [residents]
      operationId: claimUnit
      summary: Resident redeems a claim code; the device becomes bound to the unit
      description: No account, phone number or name is collected. Mistyped codes are rate-limited per device.
      security: []
      x-edge-cases: [RS-01, RS-02, RS-03]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [claimCode, deviceId]
              properties:
                claimCode: { type: string, pattern: "^[0-9]{6}$" }
                deviceId: { type: string, format: uuid }
                deviceLabel: { type: string, maxLength: 60 }
      responses:
        "201":
          description: Bound
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidentSession" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /residents/me:
    get:
      tags: [residents]
      operationId: getResidentSelf
      summary: This device's bindings, with notices (unit renumbered, merged, retired)
      security: [{ residentAuth: [] }]
      x-edge-cases: [RS-05, ID-13]
      responses:
        "200":
          description: Bindings
          content:
            application/json:
              schema:
                type: object
                required: [bindings]
                properties:
                  bindings: { type: array, items: { $ref: "#/components/schemas/ResidentBinding" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /residents/me/bindings/{bindingId}:
    delete:
      tags: [residents]
      operationId: unbindUnit
      summary: Remove this device's binding. Consent is untouched (the app asks separately).
      security: [{ residentAuth: [] }]
      x-edge-cases: [RS-04]
      parameters:
        - $ref: "#/components/parameters/BindingId"
      responses:
        "204": { description: Unbound (idempotent) }
        "404": { $ref: "#/components/responses/NotFound" }

  /residents/me/bindings/{bindingId}/peers:
    get:
      tags: [residents]
      operationId: listBindingPeers
      summary: Other devices bound to the same unit (label and date only), so an old phone can be revoked
      description: "OPEN QUESTION for the team: this also lets housemates revoke each other's bindings."
      security: [{ residentAuth: [] }]
      x-edge-cases: [RS-02]
      parameters:
        - $ref: "#/components/parameters/BindingId"
      responses:
        "200":
          description: Peer bindings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BindingPeer" }

  /residents/me/bindings/{bindingId}/peers/{peerBindingId}:
    delete:
      tags: [residents]
      operationId: revokeBindingPeer
      summary: Revoke another device's binding on the same unit (audited)
      security: [{ residentAuth: [] }]
      x-edge-cases: [RS-02]
      parameters:
        - $ref: "#/components/parameters/BindingId"
        - { name: peerBindingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked (idempotent) }
        "404": { $ref: "#/components/responses/NotFound" }

  /residents/me/consents:
    get:
      tags: [consent]
      operationId: getResidentConsents
      summary: Consent scopes held for this device's unit(s). Shows scopes and status, never values.
      security: [{ residentAuth: [] }]
      responses:
        "200":
          description: Consents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsentSummary" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /residents/me/consents/withdrawals:
    post:
      tags: [consent]
      operationId: withdrawResidentConsent
      security: [{ residentAuth: [] }]
      x-edge-cases: [PV-03, PV-07, RS-04]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentWithdrawalRequest" }
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentWithdrawalResult" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /sos:
    post:
      tags: [incidents]
      operationId: sendSos
      summary: Resident SOS. Creates exactly one incident per intent.
      description: |
        Idempotent by `Idempotency-Key` (generated when the resident confirms, reused on retry).
        If the binding already has an open SOS incident, that incident is returned with
        `alreadyOpen: true` and no new incident is created (DS-01 "SOS already sent").
      security: [{ residentAuth: [] }]
      x-edge-cases: [DS-01, DS-02, DS-06, DS-07, DS-08]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bindingId, pressedAt]
              properties:
                bindingId: { type: string, format: uuid }
                position: { $ref: "#/components/schemas/Fix" }
                pressedAt: { type: string, format: date-time }
      responses:
        "201":
          description: Incident created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SosReceipt" }
        "200":
          description: An SOS from this binding is already open
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SosReceipt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ---------------------------------------------------------------- zones
  /zones:
    get:
      tags: [zones]
      operationId: listZones
      x-roles: [admin, reviewer, dispatcher, mapper]
      responses:
        "200":
          description: Zones (mappers see their assigned zones)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zone" }
    post:
      tags: [zones]
      operationId: createZone
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /zones/{zoneId}:
    get:
      tags: [zones]
      operationId: getZone
      x-roles: [admin, reviewer, dispatcher, mapper]
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      responses:
        "200":
          description: Zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [zones]
      operationId: updateZone
      summary: Rename or redraw the boundary. The code prefix can never change once a code is issued.
      x-roles: [admin]
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                boundary: { $ref: "#/components/schemas/Polygon" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Zone" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /zones/{zoneId}/access-points:
    get:
      tags: [zones]
      operationId: listAccessPoints
      x-roles: [admin, reviewer, dispatcher, mapper]
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      responses:
        "200":
          description: Access points
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessPoint" }
    post:
      tags: [zones]
      operationId: createAccessPoint
      x-roles: [admin]
      x-edge-cases: [GP-05]
      parameters:
        - $ref: "#/components/parameters/ZoneId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessPointInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessPoint" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /access-points/{accessPointId}:
    patch:
      tags: [zones]
      operationId: updateAccessPoint
      x-roles: [admin]
      parameters: [{ $ref: "#/components/parameters/AccessPointId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessPointInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessPoint" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [zones]
      operationId: archiveAccessPoint
      summary: Archive (never hard-delete; past routes reference it)
      x-roles: [admin]
      parameters: [{ $ref: "#/components/parameters/AccessPointId" }]
      responses:
        "204": { description: Archived (idempotent) }

  /zones/{zoneId}/package:
    get:
      tags: [zones, sync]
      operationId: getZonePackage
      summary: Everything a mapper needs offline, plus the sync cursor it is current to
      description: After download, the app only calls `GET /sync/pull` from `cursor` (SY-16).
      x-roles: [mapper, admin]
      x-edge-cases: [SY-16]
      parameters:
        - $ref: "#/components/parameters/ZoneId"
        - $ref: "#/components/parameters/DeviceIdHeader"
      responses:
        "200":
          description: Zone package
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ZonePackage" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- sync
  /sync/push:
    post:
      tags: [sync]
      operationId: pushOperations
      summary: Push queued operations (batch, idempotent, ordered per device)
      description: |
        The server applies operations in `seq` order. `seq` is per device, starts at 1 and increases by 1.
        - An op already applied returns its original result with `status: duplicate` (SY-03).
        - An op whose `seq` is not the next expected one returns `status: deferred` along with every op
          after it; the response's `nextExpectedSeq` tells the app where to resume (SY-04).
        - A permanently invalid op returns `status: rejected` with an `Error` and still consumes its seq,
          so it never blocks the queue.
        - An edit on a merged or retired structure returns `status: sent_for_review` (SY-06).
        - A transient server failure part-way returns the results so far and `deferred` for the rest.
      x-roles: [mapper, admin]
      x-edge-cases: [SY-03, SY-04, SY-05, SY-06, SY-07, SY-08, SY-14, ID-01, ID-02, ID-07, GP-05, GP-06, GP-08, AC-02, RT-03]
      parameters:
        - $ref: "#/components/parameters/DeviceIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPushRequest" }
      responses:
        "200":
          description: Per-operation results, in request order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPushResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /sync/pull:
    get:
      tags: [sync]
      operationId: pullChanges
      summary: Changes since a cursor, paginated; an interrupted pull resumes from the last cursor
      x-roles: [mapper, admin]
      x-edge-cases: [SY-07, SY-13, SY-16]
      parameters:
        - $ref: "#/components/parameters/DeviceIdHeader"
        - { name: cursor, in: query, required: true, schema: { type: string } }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPullResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /sync/status:
    post:
      tags: [sync]
      operationId: reportSyncStatus
      summary: The app reports its pending counts; the server returns its view of the device
      description: Pending counts are kept so a device revocation can list what was at risk (PV-06).
      x-roles: [mapper, admin]
      x-edge-cases: [PV-06, SY-14]
      parameters:
        - $ref: "#/components/parameters/DeviceIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DevicePendingCounts" }
      responses:
        "200":
          description: Server view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- photos
  /photos/{photoId}:
    put:
      tags: [photos]
      operationId: uploadPhoto
      summary: Upload bytes for a photo already declared by its owning record (retry-safe)
      description: |
        Same ID and same bytes → 200 (no duplicate, SY-11). Same ID, different bytes → `409
        PHOTO_ID_CONFLICT`. Undeclared ID → `409 PHOTO_NOT_DECLARED`. The server strips EXIF location and
        makes the thumbnail.
      security: [{ staffAuth: [] }, { residentAuth: [] }]
      x-edge-cases: [SY-11, GV-04]
      parameters:
        - $ref: "#/components/parameters/PhotoId"
        - { name: X-Content-Sha256, in: header, required: true, schema: { type: string, pattern: "^[a-f0-9]{64}$" } }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "201": { description: Stored }
        "200": { description: Already stored with the same bytes }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
    get:
      tags: [photos]
      operationId: getPhoto
      x-roles: [admin, reviewer, dispatcher, mapper]
      parameters:
        - $ref: "#/components/parameters/PhotoId"
        - { name: variant, in: query, schema: { type: string, enum: [thumbnail, original], default: thumbnail } }
      responses:
        "200":
          description: Image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
    delete:
      tags: [photos]
      operationId: removePhoto
      summary: Remove a photo (e.g. it shows a face). Deletes original and thumbnail; audited.
      x-roles: [admin, reviewer]
      x-edge-cases: [GP-07]
      parameters:
        - $ref: "#/components/parameters/PhotoId"
        - { name: reason, in: query, required: true, schema: { type: string, enum: [face, person, private_interior, other] } }
      responses:
        "204": { description: Removed (idempotent) }

  /photos/{photoId}/flags:
    post:
      tags: [photos]
      operationId: flagPhoto
      summary: Flag a photo for reviewer removal
      x-roles: [admin, reviewer, dispatcher, mapper]
      x-edge-cases: [GP-07]
      parameters:
        - $ref: "#/components/parameters/PhotoId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [face, person, private_interior, other] }
      responses:
        "201": { description: Flagged }

  # ---------------------------------------------------------------- registry
  /structures:
    get:
      tags: [registry]
      operationId: searchStructures
      summary: Search by attributes, landmark text or proximity (code lookup is `/codes/lookup`)
      x-roles: [admin, reviewer, dispatcher, mapper]
      x-edge-cases: [DS-11]
      parameters:
        - { name: zoneId, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/StructureStatus" } }
          style: form
          explode: false
        - { name: q, in: query, description: "Free text over landmark name and colour", schema: { type: string } }
        - { name: material, in: query, schema: { $ref: "#/components/schemas/Material" } }
        - { name: colour, in: query, schema: { type: string } }
        - { name: floors, in: query, schema: { type: integer, minimum: 0 } }
        - { name: nearLat, in: query, schema: { type: number } }
        - { name: nearLon, in: query, schema: { type: number } }
        - { name: radiusM, in: query, schema: { type: number, default: 100, maximum: 1000 } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Matches, nearest first when near* is given
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/StructureSearchHit" } }

  /structures/{structureId}:
    get:
      tags: [registry]
      operationId: getStructure
      summary: Structure with entrances and units (never service records)
      x-roles: [admin, reviewer, dispatcher, mapper]
      parameters: [{ $ref: "#/components/parameters/StructureId" }]
      responses:
        "200":
          description: Structure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StructureDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /structures/{structureId}/history:
    get:
      tags: [registry]
      operationId: getStructureHistory
      summary: Field-level edit history, including losing edits from conflicts (SY-05)
      x-roles: [admin, reviewer]
      parameters:
        - $ref: "#/components/parameters/StructureId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: History
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/FieldChange" } }

  /structures/{structureId}/retirement:
    post:
      tags: [registry]
      operationId: retireStructure
      summary: Retire a structure and its code (demolished, departed). Merges retire via review decisions.
      x-roles: [admin, reviewer]
      x-edge-cases: [ID-13]
      parameters:
        - $ref: "#/components/parameters/StructureId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [demolished, departed, other] }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Retired; lists the side effects
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetirementResult" }
        "409": { $ref: "#/components/responses/Conflict" }

  /structures/{structureId}/service-records:
    get:
      tags: [registry]
      operationId: listServiceRecords
      summary: Per-structure service history. Not available to dispatchers.
      x-roles: [admin, reviewer]
      x-edge-cases: [PV-09]
      parameters: [{ $ref: "#/components/parameters/StructureId" }]
      responses:
        "200":
          description: Service records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceRecord" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /structures/{structureId}/service-records/archive:
    post:
      tags: [registry]
      operationId: archiveServiceDetail
      summary: Archive a structure's per-unit service detail (removal request)
      x-roles: [admin, reviewer]
      x-edge-cases: [PV-07]
      parameters:
        - $ref: "#/components/parameters/StructureId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grievanceId]
              properties:
                grievanceId: { type: string, format: uuid }
      responses:
        "200": { description: Archived }

  /units/{unitId}:
    get:
      tags: [registry]
      operationId: getUnit
      x-roles: [admin, reviewer, dispatcher, mapper]
      parameters: [{ $ref: "#/components/parameters/UnitId" }]
      responses:
        "200":
          description: Unit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Unit" }
        "404": { $ref: "#/components/responses/NotFound" }

  /units/{unitId}/code-card:
    get:
      tags: [registry]
      operationId: getCodeCard
      summary: Data for a printable code card (the client renders and prints it)
      x-roles: [admin, reviewer, mapper]
      parameters: [{ $ref: "#/components/parameters/UnitId" }]
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeCard" }
        "409": { $ref: "#/components/responses/Conflict" }

  /units/{unitId}/claim-codes:
    post:
      tags: [residents]
      operationId: createClaimCode
      summary: One-time claim code for a unit (needs connectivity; the unit must already be synced)
      x-roles: [mapper, admin]
      x-edge-cases: [RS-01]
      parameters:
        - $ref: "#/components/parameters/UnitId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Claim code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimCode" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /units/{unitId}/resident-bindings/revocation:
    post:
      tags: [residents]
      operationId: unbindAllResidents
      summary: Unbind every resident device from a unit (removal request or admin action)
      x-roles: [admin, reviewer]
      x-edge-cases: [PV-07, RS-02]
      parameters:
        - $ref: "#/components/parameters/UnitId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [removal_request, device_lost, admin] }
                bindingIds: { type: array, items: { type: string, format: uuid }, description: "Omit to revoke all" }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [revokedBindingIds]
                properties:
                  revokedBindingIds: { type: array, items: { type: string, format: uuid } }

  /units/{unitId}/consents:
    get:
      tags: [consent]
      operationId: listUnitConsents
      summary: Consent scopes recorded for a unit (status only, never values)
      x-roles: [mapper, admin]
      parameters: [{ $ref: "#/components/parameters/UnitId" }]
      responses:
        "200":
          description: Consents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsentSummary" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /units/{unitId}/consents/withdrawals:
    post:
      tags: [consent]
      operationId: withdrawUnitConsent
      summary: Mapper withdraws consent on a resident's behalf
      x-roles: [mapper, admin]
      x-edge-cases: [PV-03, PV-07]
      parameters:
        - $ref: "#/components/parameters/UnitId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentWithdrawalRequest" }
      responses:
        "200":
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentWithdrawalResult" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /consents:
    post:
      tags: [consent]
      operationId: captureConsent
      summary: Forward consent captured by a mapper to the vault. Never stored in the registry.
      description: |
        Not part of the sync stream (PV-05). The app keeps captured consent in a separate local queue,
        sends it here, and purges it from the device on `201`. On `503 VAULT_UNAVAILABLE` it keeps it.
        The core API logs only "consent captured for unit X by mapper Y", never the values.
      x-roles: [mapper]
      x-edge-cases: [PV-05]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/DeviceIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentCaptureRequest" }
      responses:
        "201":
          description: Stored in the vault; purge from device
          content:
            application/json:
              schema:
                type: object
                required: [consentIds]
                properties:
                  consentIds: { type: array, items: { type: string, format: uuid } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /codes/lookup:
    get:
      tags: [registry]
      operationId: lookupCode
      summary: Resolve a typed code (forgiving input) to a structure/unit
      description: |
        The server normalises and validates exactly as `fixtures/codes/vectors.json` defines. Clients
        validate first and do not call this for an invalid check character (ID-09).
        Retired codes return `200` with `status: retired` and no location. Never-issued codes return
        `404 CODE_NOT_ISSUED` and are logged for review (ID-12).
      x-roles: [admin, reviewer, dispatcher, mapper]
      x-edge-cases: [ID-09, ID-10, ID-11, ID-12]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 40 }, example: "rv 2gk9 9 / 2" }
      responses:
        "200":
          description: Active or retired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CodeLookupResult" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /stats/services:
    get:
      tags: [registry]
      operationId: getServiceStats
      summary: Aggregate service statistics for a zone (no per-structure detail)
      x-roles: [admin, reviewer]
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Aggregates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceStats" }

  # ---------------------------------------------------------------- review
  /review/items:
    get:
      tags: [review]
      operationId: listReviewItems
      x-roles: [admin, reviewer]
      x-edge-cases: [ID-01, ID-05]
      parameters:
        - { name: zoneId, in: query, schema: { type: string, format: uuid } }
        - { name: lane, in: query, schema: { $ref: "#/components/schemas/ReviewLane" } }
        - { name: state, in: query, schema: { type: string, enum: [open, deferred], default: open } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Review items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/ReviewItem" } }

  /review/approvals:
    post:
      tags: [review]
      operationId: approveStructures
      summary: Approve structures (bulk from the clear lane) and issue their codes
      description: |
        Each structure is approved independently; one failure does not roll back the others. Issuance is
        atomic with the uniqueness check against issued and retired codes (ID-08). A structure with an
        undecided or deferred duplicate candidate cannot be approved. A reviewer or admin cannot approve
        a structure they captured (AC-03).
      x-roles: [admin, reviewer]
      x-edge-cases: [ID-04, ID-05, ID-06, ID-08, AC-03]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [structureId, version]
                    properties:
                      structureId: { type: string, format: uuid }
                      version: { type: integer, description: "Structure version the reviewer looked at" }
      responses:
        "200":
          description: Per-structure results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: "#/components/schemas/ApprovalResult" } }

  /review/duplicates/{candidateId}:
    get:
      tags: [review]
      operationId: getDuplicateCandidate
      x-roles: [admin, reviewer]
      parameters: [{ $ref: "#/components/parameters/CandidateId" }]
      responses:
        "200":
          description: Candidate with both structures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateCandidateDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  /review/duplicates/{candidateId}/decision:
    post:
      tags: [review]
      operationId: decideDuplicate
      summary: Merge, distinct or defer. The second concurrent decision gets 409 ALREADY_DECIDED.
      x-roles: [admin, reviewer]
      x-edge-cases: [ID-03, ID-04, ID-05, ID-06]
      parameters:
        - $ref: "#/components/parameters/CandidateId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuplicateDecisionRequest" }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicateDecisionResult" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /review/edits:
    get:
      tags: [review]
      operationId: listEditReviews
      summary: Edits needing a human look (conflicting field edits, edits on merged/retired records)
      x-roles: [admin, reviewer]
      x-edge-cases: [SY-05, SY-06]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, resolved], default: open } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Edit reviews
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/EditReview" } }

  /review/edits/{editReviewId}/decision:
    post:
      tags: [review]
      operationId: decideEditReview
      x-roles: [admin, reviewer]
      x-edge-cases: [SY-05, SY-06, ID-06]
      parameters:
        - { name: editReviewId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [apply, keep_current, dismiss] }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditReview" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------------- graph
  /graph/status:
    get:
      tags: [graph]
      operationId: getGraphStatus
      x-roles: [admin, reviewer, dispatcher]
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Graph status for the zone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphStatus" }

  /graph/versions:
    get:
      tags: [graph]
      operationId: listGraphVersions
      x-roles: [admin, reviewer]
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Versions, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/GraphVersion" } }
    post:
      tags: [graph]
      operationId: createGraphVersion
      summary: Start a build from traces, or copy a version into a new draft (to remove edges, GR-08)
      x-roles: [admin, reviewer]
      x-edge-cases: [GR-08, GP-01]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GraphVersionCreate" }
      responses:
        "202":
          description: Accepted; status is `building` until a `graph.build_finished` event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphVersion" }
        "409": { $ref: "#/components/responses/Conflict" }

  /graph/versions/{versionId}:
    get:
      tags: [graph]
      operationId: getGraphVersion
      x-roles: [admin, reviewer]
      parameters: [{ $ref: "#/components/parameters/VersionId" }]
      responses:
        "200":
          description: Version with metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphVersion" }
        "404": { $ref: "#/components/responses/NotFound" }

  /graph/versions/{versionId}/edges:
    get:
      tags: [graph]
      operationId: getGraphEdges
      summary: Edges as GeoJSON with trace support, for draft inspection and console display
      x-roles: [admin, reviewer, dispatcher]
      parameters: [{ $ref: "#/components/parameters/VersionId" }]
      responses:
        "200":
          description: Edges
          content:
            application/geo+json:
              schema: { $ref: "#/components/schemas/GraphEdgeCollection" }

  /graph/versions/{versionId}/snaps:
    get:
      tags: [graph]
      operationId: getGraphSnaps
      summary: How every entrance and access point snaps to this version (routable or not, distance)
      x-roles: [admin, reviewer]
      x-edge-cases: [GR-01, GR-05]
      parameters: [{ $ref: "#/components/parameters/VersionId" }]
      responses:
        "200":
          description: Snaps
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Snap" }

  /graph/versions/{versionId}/edge-removals:
    post:
      tags: [graph]
      operationId: removeGraphEdges
      summary: Remove edges from a draft (409 GRAPH_NOT_DRAFT otherwise)
      x-roles: [admin, reviewer]
      x-edge-cases: [GR-08]
      parameters:
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [edgeIds, reason]
              properties:
                edgeIds: { type: array, minItems: 1, items: { type: string } }
                reason: { type: string, maxLength: 300 }
      responses:
        "200":
          description: Updated draft (snaps recomputed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphVersion" }
        "409": { $ref: "#/components/responses/Conflict" }

  /graph/versions/{versionId}/publish:
    post:
      tags: [graph]
      operationId: publishGraphVersion
      summary: Publish a draft; supersedes the current published version
      description: |
        If publishing would make previously routable entrances unroutable, the server returns `409
        PUBLISH_NEEDS_CONFIRMATION` with `details.newlyUnroutable`. The reviewer resubmits with exactly
        those IDs in `confirmNewlyUnroutable` (GR-05).
      x-roles: [admin, reviewer]
      x-edge-cases: [GR-04, GR-05]
      parameters:
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirmNewlyUnroutable: { type: array, items: { type: string, format: uuid }, default: [] }
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphVersion" }
        "409": { $ref: "#/components/responses/Conflict" }

  /traces:
    get:
      tags: [graph]
      operationId: listTraces
      summary: Synced traces (summary only)
      x-roles: [admin, reviewer]
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: sinceVersionId, in: query, description: "Only traces not used by this graph version", schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Traces
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/TraceSummary" } }

  /traces/{traceId}:
    get:
      tags: [graph]
      operationId: getTrace
      x-roles: [admin, reviewer]
      parameters:
        - { name: traceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Trace with fixes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Trace" }
        "404": { $ref: "#/components/responses/NotFound" }

  /routes:
    post:
      tags: [graph]
      operationId: computeRoute
      summary: Walking route from an access point to an entrance/unit/structure. Refuses rather than guesses.
      description: |
        Uses the latest published graph unless `graphVersionId` pins one. Refusals are `422` with code
        `OUTSIDE_NETWORK` (details: distanceM, thresholdM, entranceId, taskId — a verification task is
        raised), `NO_ROUTE` (details: nearestReachable), `NO_GRAPH_PUBLISHED` or `ORIGIN_INVALID`.
        A structure with no entrance routes to the network point nearest its centroid, with
        `approximate: true` and warning `NO_ENTRANCE_MAPPED` (GR-02). Without an origin, the nearest
        access point to the target is used and warning `ORIGIN_DEFAULTED` is set (GR-07).
        When `incidentId` is given the route is pinned to that incident.
      x-roles: [admin, reviewer, dispatcher]
      x-edge-cases: [GR-01, GR-02, GR-03, GR-04, GR-06, GR-07]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteRequest" }
      responses:
        "200":
          description: Route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Route" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # ---------------------------------------------------------------- tasks
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Verification tasks, highest priority first. Mappers complete them through sync (`task.complete`).
      x-roles: [admin, reviewer, mapper]
      parameters:
        - { name: zoneId, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/TaskStatus" } }
          style: form
          explode: false
        - { name: priority, in: query, schema: { $ref: "#/components/schemas/TaskPriority" } }
        - { name: assignee, in: query, description: "`me` or an account ID", schema: { type: string } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/VerificationTask" } }

  /tasks/{taskId}:
    get:
      tags: [tasks]
      operationId: getTask
      x-roles: [admin, reviewer, mapper]
      parameters: [{ $ref: "#/components/parameters/TaskId" }]
      responses:
        "200":
          description: Task with evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationTask" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tasks]
      operationId: triageTask
      summary: Assign, reprioritise or dismiss
      x-roles: [admin, reviewer]
      parameters: [{ $ref: "#/components/parameters/TaskId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assigneeId: { type: [string, "null"], format: uuid }
                priority: { $ref: "#/components/schemas/TaskPriority" }
                status: { type: string, enum: [dismissed] }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationTask" }
        "409": { $ref: "#/components/responses/Conflict" }

  /tasks/{taskId}/evidence:
    post:
      tags: [tasks]
      operationId: addTaskEvidence
      x-roles: [admin, reviewer, dispatcher]
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceInput" }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceEvent" }

  # ---------------------------------------------------------------- grievances
  /grievances:
    get:
      tags: [grievances]
      operationId: listGrievances
      x-roles: [admin, reviewer]
      parameters:
        - name: status
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/GrievanceStatus" } }
          style: form
          explode: false
        - { name: structureId, in: query, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Grievances
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Grievance" } }
    post:
      tags: [grievances]
      operationId: submitGrievance
      summary: Report from the resident app (target defaults to the claimed unit) or a staff member online
      description: Mappers offline use the `grievance.create` sync op instead. Photos upload separately via `PUT /photos/{photoId}`.
      security: [{ staffAuth: [] }, { residentAuth: [] }]
      x-edge-cases: [GV-01, GV-02, GV-04]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrievanceInput" }
      responses:
        "201":
          description: Received
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grievance" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /grievances/{grievanceId}:
    get:
      tags: [grievances]
      operationId: getGrievance
      x-roles: [admin, reviewer]
      parameters: [{ $ref: "#/components/parameters/GrievanceId" }]
      responses:
        "200":
          description: Grievance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grievance" }
        "404": { $ref: "#/components/responses/NotFound" }

  /grievances/{grievanceId}/corroborations:
    post:
      tags: [grievances]
      operationId: corroborateGrievance
      summary: Link another grievance or a mapper verification as corroboration (adds evidence weight)
      x-roles: [admin, reviewer]
      x-edge-cases: [GV-03]
      parameters:
        - $ref: "#/components/parameters/GrievanceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                otherGrievanceId: { type: string, format: uuid }
                taskId: { type: string, format: uuid, description: "A completed verification task that confirms it" }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grievance" }

  /grievances/{grievanceId}/decision:
    post:
      tags: [grievances]
      operationId: decideGrievance
      summary: Confirm (raises a P2 verification task) or reject
      x-roles: [admin, reviewer]
      x-edge-cases: [GV-03, ID-06]
      parameters:
        - $ref: "#/components/parameters/GrievanceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [confirmed, rejected] }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Grievance" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------------- incidents
  /incidents:
    get:
      tags: [incidents]
      operationId: listIncidents
      x-roles: [admin, dispatcher]
      x-edge-cases: [DS-02]
      parameters:
        - name: status
          in: query
          schema: { type: array, items: { $ref: "#/components/schemas/IncidentStatus" } }
          style: form
          explode: false
        - { name: unacknowledged, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Incidents, unacknowledged SOS first, then newest
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/IncidentSummary" } }
    post:
      tags: [incidents]
      operationId: createIncident
      summary: New call or manual incident (the creator holds the lock)
      x-roles: [admin, dispatcher]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { type: string, enum: [call, manual] }
                note: { type: string, maxLength: 1000, description: "Operational note only; no caller identity" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }

  /incidents/{incidentId}:
    get:
      tags: [incidents]
      operationId: getIncident
      summary: Full incident with lock, location, pinned routes, assignments, shares and timeline
      x-roles: [admin, dispatcher]
      x-edge-cases: [DS-06, DS-07, DS-08, DS-09, GR-04]
      parameters: [{ $ref: "#/components/parameters/IncidentId" }]
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "404": { $ref: "#/components/responses/NotFound" }

  /incidents/{incidentId}/acknowledgement:
    post:
      tags: [incidents]
      operationId: acknowledgeIncident
      summary: Acknowledge an SOS card (stops escalation). Does not take the lock.
      x-roles: [admin, dispatcher]
      x-edge-cases: [DS-02, DS-04]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Acknowledged (idempotent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }

  /incidents/{incidentId}/lock:
    post:
      tags: [incidents]
      operationId: claimIncident
      summary: Claim the lock, renew it, or take it over
      description: |
        Without `takeover`, fails with `409 INCIDENT_LOCKED` (details.holder) if someone else holds an
        unexpired lock. With `takeover: true` the lock moves to the caller and the takeover is audited.
        Any mutating call by the holder renews the lock; it expires after `lockTtlSeconds` of inactivity.
      x-roles: [admin, dispatcher]
      x-edge-cases: [DS-09, DS-10]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                takeover: { type: boolean, default: false }
      responses:
        "200":
          description: Lock held by caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentLock" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [incidents]
      operationId: releaseIncident
      x-roles: [admin, dispatcher]
      parameters: [{ $ref: "#/components/parameters/IncidentId" }]
      responses:
        "204": { description: Released (idempotent) }
        "409": { $ref: "#/components/responses/Conflict" }

  /incidents/{incidentId}/location:
    post:
      tags: [incidents]
      operationId: locateIncident
      summary: Set the resolved structure/unit and record which method found it
      x-roles: [admin, dispatcher]
      x-edge-cases: [DS-09, DS-11]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentLocationInput" }
      responses:
        "200":
          description: Located
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /incidents/{incidentId}/occupant-context:
    get:
      tags: [incidents, consent]
      operationId: getOccupantContext
      summary: Consent-permitted occupant context for the located unit (asks the vault; audited every time)
      description: |
        Never cached (`Cache-Control: no-store`), never logged, never written to the registry. If the vault
        is down, returns `200` with `status: vault_unavailable` so dispatch is never blocked (PV-04).
      x-roles: [admin, dispatcher]
      x-edge-cases: [PV-01, PV-02, PV-03, PV-04]
      parameters: [{ $ref: "#/components/parameters/IncidentId" }]
      responses:
        "200":
          description: Context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupantContext" }
        "409": { $ref: "#/components/responses/Conflict" }

  /incidents/{incidentId}/location-shares:
    post:
      tags: [incidents]
      operationId: createLocationShare
      summary: One-time link/QR the caller opens to send their browser position
      x-roles: [admin, dispatcher]
      x-edge-cases: [DS-11, DS-12]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationShare" }
        "409": { $ref: "#/components/responses/Conflict" }

  /incidents/{incidentId}/assignments:
    post:
      tags: [incidents]
      operationId: assignResponder
      summary: Assign a responder and get their link. Takes the lock if free.
      description: Set `replacesAssignmentId` to reissue after revocation or a tunnel restart (DS-15, DS-17).
      x-roles: [admin, dispatcher]
      x-edge-cases: [DS-09, DS-15, DS-17]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [responderLabel]
              properties:
                responderLabel: { type: string, maxLength: 40, description: "Call sign, e.g. 'Security team 2'. Not a person's name." }
                replacesAssignmentId: { type: string, format: uuid }
      responses:
        "201":
          description: Assignment with link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponderAssignment" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /assignments/{assignmentId}/revocation:
    post:
      tags: [incidents]
      operationId: revokeAssignment
      x-roles: [admin, dispatcher]
      x-edge-cases: [DS-14, DS-15]
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Revoked (idempotent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponderAssignment" }
        "409": { $ref: "#/components/responses/Conflict" }

  /incidents/{incidentId}/outcome:
    post:
      tags: [incidents]
      operationId: recordDispatcherOutcome
      summary: Dispatcher records reached or failed. `failed` raises a P1 verification task.
      x-roles: [admin, dispatcher]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [reached, failed] }
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "409": { $ref: "#/components/responses/Conflict" }

  /incidents/{incidentId}/cancellation:
    post:
      tags: [incidents]
      operationId: cancelIncident
      summary: Cancel (false alarm). Revokes tokens; raises no task.
      x-roles: [admin, dispatcher]
      x-edge-cases: [DS-19]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [false_alarm, duplicate, test, other] }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "409": { $ref: "#/components/responses/Conflict" }

  /incidents/{incidentId}/closure:
    post:
      tags: [incidents]
      operationId: closeIncident
      summary: Close after an outcome. Revokes tokens.
      x-roles: [admin, dispatcher]
      x-edge-cases: [DS-14]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------------------------------------------------------- public (token-gated, no login)
  /public/responder/{token}:
    get:
      tags: [public]
      operationId: getResponderView
      summary: Everything the responder page needs for one incident
      security: []
      x-edge-cases: [DS-14, DS-15, DS-16]
      parameters: [{ $ref: "#/components/parameters/Token" }]
      responses:
        "200":
          description: View
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResponderView" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }

  /public/responder/{token}/entrance-photo:
    get:
      tags: [public]
      operationId: getResponderEntrancePhoto
      security: []
      parameters: [{ $ref: "#/components/parameters/Token" }]
      responses:
        "200":
          description: Entrance photo (thumbnail size)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }

  /public/responder/{token}/outcome:
    post:
      tags: [public]
      operationId: submitResponderOutcome
      summary: Reached / couldn't find, queued on the device if offline and sent later
      description: |
        `couldnt_find` raises a P1 verification task with this evidence; a note tagged `path_problem`
        also raises a graph task (GR-08). `reached` far from the entrance raises a P2 task (DS-18).
      security: []
      x-edge-cases: [DS-16, DS-18, GR-08]
      parameters:
        - $ref: "#/components/parameters/Token"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResponderOutcomeInput" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required: [recordedAt]
                properties:
                  recordedAt: { type: string, format: date-time }
                  photoIds: { type: array, items: { type: string, format: uuid } }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /public/responder/{token}/photos/{photoId}:
    put:
      tags: [public]
      operationId: uploadResponderPhoto
      summary: Evidence photo declared in the outcome (same retry rules as `PUT /photos/{photoId}`)
      security: []
      parameters:
        - $ref: "#/components/parameters/Token"
        - $ref: "#/components/parameters/PhotoId"
        - { name: X-Content-Sha256, in: header, required: true, schema: { type: string, pattern: "^[a-f0-9]{64}$" } }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "201": { description: Stored }
        "200": { description: Already stored }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /public/location-shares/{token}:
    get:
      tags: [public]
      operationId: getLocationShareStatus
      summary: Whether the link is still usable. Reveals nothing about the incident.
      security: []
      x-edge-cases: [DS-12]
      parameters: [{ $ref: "#/components/parameters/Token" }]
      responses:
        "200":
          description: Usable
          content:
            application/json:
              schema:
                type: object
                required: [status, expiresAt]
                properties:
                  status: { type: string, enum: [active] }
                  expiresAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
    post:
      tags: [public]
      operationId: submitLocationShare
      summary: Send browser position, or a landmark description if location permission was denied
      security: []
      x-edge-cases: [DS-12, DS-13]
      parameters:
        - $ref: "#/components/parameters/Token"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                position: { $ref: "#/components/schemas/Fix" }
                landmarkText: { type: string, maxLength: 300 }
      responses:
        "201":
          description: Location sent (the page shows only "location sent")
          content:
            application/json:
              schema:
                type: object
                required: [resubmission]
                properties:
                  resubmission: { type: boolean }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /public/reports:
    post:
      tags: [public]
      operationId: submitPublicReport
      summary: Public report form (code + optional photo + location). Rate-limited per client.
      security: []
      x-edge-cases: [GV-01, GV-02, GV-04, GV-05]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicReportInput" }
      responses:
        "201":
          description: Received. `photoUploadToken` is present when a photoId was declared.
          content:
            application/json:
              schema:
                type: object
                required: [reportId, status]
                properties:
                  reportId: { type: string, format: uuid }
                  status: { $ref: "#/components/schemas/GrievanceStatus" }
                  photoUploadToken: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /public/reports/{reportId}/photo:
    put:
      tags: [public]
      operationId: uploadPublicReportPhoto
      security: []
      x-edge-cases: [GV-04]
      parameters:
        - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Upload-Token, in: header, required: true, schema: { type: string } }
        - { name: X-Content-Sha256, in: header, required: true, schema: { type: string, pattern: "^[a-f0-9]{64}$" } }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "201": { description: Stored }
        "200": { description: Already stored }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  # ---------------------------------------------------------------- live
  /live/tickets:
    post:
      tags: [live]
      operationId: createLiveTicket
      summary: Single-use, short-lived ticket for opening the WebSocket (browsers can't set auth headers)
      x-roles: [admin, reviewer, dispatcher]
      responses:
        "201":
          description: Ticket
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expiresAt]
                properties:
                  ticket: { type: string }
                  expiresAt: { type: string, format: date-time }

  /live:
    get:
      tags: [live]
      operationId: openLiveChannel
      summary: WebSocket upgrade. One channel per console session.
      description: |
        On connect the server sends `hello`, then every event after `cursor` (replay), then live events.
        Server → client messages are `LiveServerMessage`. The client replies to `ping` with
        `{"type":"pong"}`. Close codes: 4401 ticket invalid / account disabled (AC-02), 4403 role changed
        (reconnect with a new ticket, AC-04), 4409 cursor invalid (resync from `GET /events` from 0).
        Events are filtered by role. No event contains personal data.
      security: []
      x-edge-cases: [DS-02, DS-03, DS-04, DS-17, AC-02, AC-04]
      parameters:
        - { name: ticket, in: query, required: true, schema: { type: string } }
        - { name: cursor, in: query, description: "Last cursor the client processed; omit for 'from now'", schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "101": { description: Switching protocols }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /events:
    get:
      tags: [live]
      operationId: listEvents
      summary: The live event stream over REST, for catch-up and tests
      x-roles: [admin, reviewer, dispatcher]
      x-edge-cases: [DS-03]
      parameters:
        - { name: after, in: query, required: true, schema: { type: integer, format: int64, minimum: 0 } }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Events with cursor > after, ascending
          content:
            application/json:
              schema:
                type: object
                required: [events, latestCursor]
                properties:
                  events: { type: array, items: { $ref: "#/components/schemas/LiveEvent" } }
                  latestCursor: { type: integer, format: int64 }

  # ---------------------------------------------------------------- imagery
  /imagery/runs:
    get:
      tags: [imagery]
      operationId: listImageryRuns
      x-roles: [admin, reviewer]
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImageryRun" }
    post:
      tags: [imagery]
      operationId: importImageryRun
      summary: Atomic import of one change-detection run; same runKey twice changes nothing
      description: |
        All-or-nothing (IM-01). A repeated `runKey` returns the existing run with `200` (IM-02). Cells
        overlapping an open task add evidence to it instead of creating a task (IM-03).
      x-roles: [admin]
      x-edge-cases: [IM-01, IM-02, IM-03, IM-04, IM-05, IM-06]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageryRunInput" }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageryRun" }
        "200":
          description: Already imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageryRun" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /imagery/runs/{runId}:
    get:
      tags: [imagery]
      operationId: getImageryRun
      x-roles: [admin, reviewer]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Run with candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageryRun" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- admin
  /accounts:
    get:
      tags: [admin]
      operationId: listAccounts
      x-roles: [admin]
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
    post:
      tags: [admin]
      operationId: createAccount
      summary: Invite-only staff account
      x-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role, initialPassword]
              properties:
                username: { type: string, pattern: "^[a-z0-9][a-z0-9.-]{2,31}$", description: "A handle, not a person's name" }
                role: { $ref: "#/components/schemas/StaffRole" }
                initialPassword: { type: string, minLength: 10, writeOnly: true }
                zoneIds: { type: array, items: { type: string, format: uuid } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "409": { $ref: "#/components/responses/Conflict" }

  /accounts/{accountId}:
    patch:
      tags: [admin]
      operationId: updateAccount
      summary: Change role, status or zones. Takes effect on the account's next request.
      x-roles: [admin]
      x-edge-cases: [AC-02, AC-04]
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: "#/components/schemas/StaffRole" }
                status: { type: string, enum: [active, disabled] }
                zoneIds: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "409": { $ref: "#/components/responses/Conflict" }

  /accounts/{accountId}/password:
    put:
      tags: [admin]
      operationId: resetPassword
      summary: Admin sets a new password; clears login throttling
      x-roles: [admin]
      x-edge-cases: [AC-01]
      parameters: [{ $ref: "#/components/parameters/AccountId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string, minLength: 10, writeOnly: true }
      responses:
        "204": { description: Reset }

  /audit:
    get:
      tags: [admin]
      operationId: listAudit
      x-roles: [admin]
      parameters:
        - { name: actorId, in: query, schema: { type: string, format: uuid } }
        - { name: targetId, in: query, schema: { type: string, format: uuid } }
        - { name: action, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [data]
                    properties:
                      data: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }

  /admin/public-address:
    get:
      tags: [admin]
      operationId: getPublicAddress
      summary: Current public (tunnel) URL, shown as a QR for apps
      x-roles: [admin, reviewer, dispatcher]
      x-edge-cases: [RT-01, SY-15, DS-17]
      responses:
        "200":
          description: Address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicAddress" }

  /admin/demo-reset:
    post:
      tags: [admin]
      operationId: resetDemo
      summary: Restore the seeded state. Field capture is kept unless `includeFieldCapture` is true.
      x-roles: [admin]
      x-edge-cases: [RT-04]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, const: RESET }
                includeFieldCapture: { type: boolean, default: false }
      responses:
        "202": { description: Reset started; clients receive `system.demo_reset` and must re-download }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /health:
    get:
      tags: [admin]
      operationId: getHealth
      summary: Per-component health. Returns 200 with `degraded` rather than failing (RT-05).
      security: []
      x-edge-cases: [RT-05, PV-04]
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

components:
  securitySchemes:
    staffAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Staff access token from /auth/login. Role is re-checked against the database on every request.
    residentAuth:
      type: http
      scheme: bearer
      description: Device token from /residents/claims. Identifies a device, never a person.

  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Generated once per user intent, reused on every retry. UUID recommended.
      schema: { type: string, minLength: 8, maxLength: 128 }
    DeviceIdHeader:
      name: X-Device-Id
      in: header
      required: true
      description: The registered device making the call. Revoked devices get 403 DEVICE_REVOKED.
      schema: { type: string, format: uuid }
    ZoneId: { name: zoneId, in: path, required: true, schema: { type: string, format: uuid } }
    AccessPointId: { name: accessPointId, in: path, required: true, schema: { type: string, format: uuid } }
    StructureId: { name: structureId, in: path, required: true, schema: { type: string, format: uuid } }
    UnitId: { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
    PhotoId: { name: photoId, in: path, required: true, schema: { type: string, format: uuid } }
    DeviceId: { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
    BindingId: { name: bindingId, in: path, required: true, schema: { type: string, format: uuid } }
    CandidateId: { name: candidateId, in: path, required: true, schema: { type: string, format: uuid } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    GrievanceId: { name: grievanceId, in: path, required: true, schema: { type: string, format: uuid } }
    IncidentId: { name: incidentId, in: path, required: true, schema: { type: string, format: uuid } }
    AccountId: { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    Token: { name: token, in: path, required: true, schema: { type: string, minLength: 22 } }

  responses:
    Unauthorized:
      description: "UNAUTHENTICATED, TOKEN_EXPIRED, REFRESH_EXPIRED, INVALID_CREDENTIALS, ACCOUNT_DISABLED, BINDING_REVOKED"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: "FORBIDDEN_ROLE, DEVICE_REVOKED, DEVICE_NOT_REGISTERED, ZONE_NOT_ASSIGNED, ACCOUNT_DISABLED, UPLOAD_TOKEN_INVALID"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: "NOT_FOUND, CODE_NOT_ISSUED, CLAIM_CODE_INVALID, LINK_INVALID"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: "IDEMPOTENCY_IN_FLIGHT, VERSION_CONFLICT, ALREADY_DECIDED, INCIDENT_LOCKED, INCIDENT_CLOSED, CLAIM_CODE_USED, GRAPH_NOT_DRAFT, GRAPH_BUILD_IN_PROGRESS, PUBLISH_NEEDS_CONFIRMATION, PHOTO_ID_CONFLICT, PHOTO_NOT_DECLARED, DUPLICATE_UNDECIDED, CANNOT_APPROVE_OWN_CAPTURE, STRUCTURE_RETIRED, CODE_NOT_ISSUED_YET, USERNAME_TAKEN, DEVICE_OWNED_BY_OTHER"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Gone:
      description: "LINK_EXPIRED, LINK_REVOKED, DISPATCH_ENDED, CLAIM_CODE_EXPIRED, PHOTO_REMOVED"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PayloadTooLarge:
      description: PHOTO_TOO_LARGE
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unprocessable:
      description: "VALIDATION_ERROR, IDEMPOTENCY_KEY_REUSED, CODE_FORMAT_INVALID, CODE_CHECKSUM_INVALID, OUTSIDE_ZONE, OUTSIDE_NETWORK, NO_ROUTE, NO_GRAPH_PUBLISHED, ORIGIN_INVALID, INCIDENT_NOT_LOCATED, CURSOR_INVALID, ZONE_PREFIX_INVALID, CONFIRMATION_REQUIRED, TOKEN_ROUTE_UNAVAILABLE"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    TooManyRequests:
      description: "RATE_LIMITED, LOGIN_THROTTLED. `Retry-After` header is set."
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    ServiceUnavailable:
      description: "VAULT_UNAVAILABLE, SERVER_BUSY, SERVICE_DEGRADED. `Retry-After` header is set."
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    # ---------------------------------------------------------- common
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, description: "Safe to show users; never contains personal data" }
            details: { type: object, additionalProperties: true, description: "Machine-readable extras, documented per code" }
            requestId: { type: string }

    ErrorCode:
      type: string
      description: Every error code the API can return. Adding a code is backwards-compatible; clients must treat unknown codes as generic failures.
      enum:
        - VALIDATION_ERROR
        - INTERNAL_ERROR
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - REFRESH_EXPIRED
        - INVALID_CREDENTIALS
        - LOGIN_THROTTLED
        - ACCOUNT_DISABLED
        - FORBIDDEN_ROLE
        - DEVICE_REVOKED
        - DEVICE_NOT_REGISTERED
        - DEVICE_OWNED_BY_OTHER
        - ZONE_NOT_ASSIGNED
        - USERNAME_TAKEN
        - NOT_FOUND
        - RATE_LIMITED
        - SERVER_BUSY
        - SERVICE_DEGRADED
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_FLIGHT
        - VERSION_CONFLICT
        - CURSOR_INVALID
        - CONFIRMATION_REQUIRED
        - OUTSIDE_ZONE
        - ZONE_PREFIX_INVALID
        - PHOTO_ID_CONFLICT
        - PHOTO_NOT_DECLARED
        - PHOTO_TOO_LARGE
        - PHOTO_REMOVED
        - UNSUPPORTED_MEDIA_TYPE
        - UPLOAD_TOKEN_INVALID
        - CODE_FORMAT_INVALID
        - CODE_CHECKSUM_INVALID
        - CODE_NOT_ISSUED
        - CODE_NOT_ISSUED_YET
        - STRUCTURE_RETIRED
        - ALREADY_DECIDED
        - DUPLICATE_UNDECIDED
        - CANNOT_APPROVE_OWN_CAPTURE
        - CLAIM_CODE_INVALID
        - CLAIM_CODE_EXPIRED
        - CLAIM_CODE_USED
        - BINDING_REVOKED
        - GRAPH_NOT_DRAFT
        - GRAPH_BUILD_IN_PROGRESS
        - PUBLISH_NEEDS_CONFIRMATION
        - NO_GRAPH_PUBLISHED
        - OUTSIDE_NETWORK
        - NO_ROUTE
        - ORIGIN_INVALID
        - INCIDENT_LOCKED
        - INCIDENT_CLOSED
        - INCIDENT_NOT_LOCATED
        - LINK_INVALID
        - LINK_EXPIRED
        - LINK_REVOKED
        - DISPATCH_ENDED
        - TOKEN_ROUTE_UNAVAILABLE
        - VAULT_UNAVAILABLE

    PageMeta:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { type: [string, "null"] }

    Point:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: Point }
        coordinates: { type: array, minItems: 2, maxItems: 2, items: { type: number }, description: "[lon, lat]" }

    Polygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: Polygon }
        coordinates:
          type: array
          items: { type: array, minItems: 4, items: { type: array, minItems: 2, maxItems: 2, items: { type: number } } }

    LineString:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: LineString }
        coordinates: { type: array, minItems: 2, items: { type: array, minItems: 2, maxItems: 2, items: { type: number } } }

    Fix:
      type: object
      description: One GPS reading. Accuracy is always kept; low-accuracy fixes are stored but excluded from graph builds (GP-01).
      required: [lat, lon, accuracyM, capturedAt]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: number, minimum: 0 }
        capturedAt: { type: string, format: date-time, description: "Device time, as reported" }

    Actor:
      type: object
      required: [id, kind]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [account, device, responder, public, system] }
        username: { type: string, description: "Staff handle when kind is account" }

    Timestamps:
      type: object
      required: [createdAt, updatedAt]
      properties:
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ---------------------------------------------------------- auth & accounts
    StaffRole:
      type: string
      enum: [admin, reviewer, dispatcher, mapper]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, writeOnly: true }
        deviceId: { type: string, format: uuid, description: "Sent by the app; must be registered or registrable" }

    Session:
      type: object
      required: [accessToken, accessExpiresAt, refreshToken, refreshExpiresAt, account]
      properties:
        accessToken: { type: string }
        accessExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshExpiresAt: { type: string, format: date-time }
        account: { $ref: "#/components/schemas/Account" }

    Account:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, username, role, status, zoneIds]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            role: { $ref: "#/components/schemas/StaffRole" }
            status: { type: string, enum: [active, disabled] }
            zoneIds: { type: array, items: { type: string, format: uuid } }

    Device:
      type: object
      required: [id, kind, label, status, registeredAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [mapper, resident] }
        accountId: { type: [string, "null"], format: uuid }
        label: { type: string }
        status: { type: string, enum: [active, revoked] }
        registeredAt: { type: string, format: date-time }
        lastSyncAt: { type: [string, "null"], format: date-time }
        lastAppliedSeq: { type: integer }
        lastReportedPending: { $ref: "#/components/schemas/DevicePendingCounts" }

    DeviceRevocation:
      type: object
      required: [device, atRisk]
      properties:
        device: { $ref: "#/components/schemas/Device" }
        atRisk:
          description: Unsynced items at the device's last report, recorded in the audit (PV-06). Counts only.
          allOf: [{ $ref: "#/components/schemas/DevicePendingCounts" }]

    ClientConfig:
      type: object
      required: [testDispatchNumber, gpsAccuracyThresholdM, snapThresholdM, photoMaxBytes, sosEscalateAfterSeconds, lockTtlSeconds, emergencyNumberDenyList]
      properties:
        testDispatchNumber:
          type: string
          description: The only number the app may call or text (DS-20). The server refuses to start if it is unset or on the deny list; the app re-checks against `emergencyNumberDenyList`.
        emergencyNumberDenyList: { type: array, items: { type: string } }
        gpsAccuracyThresholdM: { type: number }
        snapThresholdM: { type: number }
        photoMaxBytes: { type: integer }
        sosEscalateAfterSeconds: { type: integer }
        lockTtlSeconds: { type: integer }
        farFromUnitThresholdM: { type: number }

    # ---------------------------------------------------------- residents
    ClaimCode:
      type: object
      required: [unitId, claimCode, qrPayload, expiresAt]
      properties:
        unitId: { type: string, format: uuid }
        claimCode: { type: string, pattern: "^[0-9]{6}$" }
        qrPayload: { type: string, description: "doorstep://claim?c=<claimCode>&s=<server base URL>" }
        expiresAt: { type: string, format: date-time }

    ResidentSession:
      type: object
      required: [deviceToken, binding]
      properties:
        deviceToken: { type: string }
        binding: { $ref: "#/components/schemas/ResidentBinding" }
        peerCount: { type: integer, description: "Other devices bound to the same unit" }

    ResidentBinding:
      type: object
      required: [id, unitId, status, code, unitNumber, spokenForm, createdAt]
      properties:
        id: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        status: { type: string, enum: [active, revoked] }
        code: { type: string, example: "RV-2GK9-9" }
        unitNumber: { type: integer }
        unitLabel: { type: string }
        spokenForm: { type: string }
        registeredLocationRetired: { type: boolean }
        notice:
          type: [object, "null"]
          description: Shown once to the resident (RS-05, ID-13)
          required: [kind, at]
          properties:
            kind: { type: string, enum: [code_changed, unit_merged, unit_renumbered, structure_retired, binding_revoked] }
            previousCode: { type: string }
            at: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    BindingPeer:
      type: object
      required: [bindingId, deviceLabel, createdAt]
      properties:
        bindingId: { type: string, format: uuid }
        deviceLabel: { type: string }
        createdAt: { type: string, format: date-time }

    SosReceipt:
      type: object
      required: [incidentId, alreadyOpen, receivedAt]
      properties:
        incidentId: { type: string, format: uuid }
        alreadyOpen: { type: boolean }
        receivedAt: { type: string, format: date-time }

    # ---------------------------------------------------------- zones
    ZoneInput:
      type: object
      required: [name, codePrefix, boundary]
      properties:
        name: { type: string, maxLength: 80 }
        codePrefix: { type: string, pattern: "^[0-9A-HJKMNP-TV-Z]{2}$", description: "Crockford base32 only" }
        boundary: { $ref: "#/components/schemas/Polygon" }

    Zone:
      allOf:
        - $ref: "#/components/schemas/ZoneInput"
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }

    AccessPointInput:
      type: object
      required: [label, kind, location]
      properties:
        label: { type: string, maxLength: 60 }
        kind: { type: string, enum: [gate, drop_off, other] }
        location: { $ref: "#/components/schemas/Point" }

    AccessPoint:
      allOf:
        - $ref: "#/components/schemas/AccessPointInput"
        - type: object
          required: [id, zoneId, status]
          properties:
            id: { type: string, format: uuid }
            zoneId: { type: string, format: uuid }
            status: { type: string, enum: [active, archived] }

    ZonePackage:
      type: object
      required: [zone, accessPoints, structures, tasks, cursor, generatedAt]
      properties:
        zone: { $ref: "#/components/schemas/Zone" }
        accessPoints: { type: array, items: { $ref: "#/components/schemas/AccessPoint" } }
        structures:
          type: array
          description: Candidates, pending and confirmed structures with entrances and units. Retired ones are listed by code only.
          items: { $ref: "#/components/schemas/StructureDetail" }
        retiredCodes: { type: array, items: { $ref: "#/components/schemas/RetiredCode" } }
        tasks: { type: array, items: { $ref: "#/components/schemas/VerificationTask" } }
        cursor: { type: string, description: "Pass to GET /sync/pull next" }
        generatedAt: { type: string, format: date-time }

    # ---------------------------------------------------------- registry
    StructureStatus:
      type: string
      enum: [candidate, pending_review, confirmed, retired]

    Material:
      type: string
      enum: [concrete, brick, tin_sheet, wood, tarpaulin, mixed, other, unknown]

    VerificationMethod:
      type: string
      enum: [mapper_visit, dispatch_outcome, still_true_check, reviewer_desk, bootstrap]

    StructureAttributes:
      type: object
      description: Field-editable attributes (field-level merge applies to each, SY-05)
      properties:
        material: { $ref: "#/components/schemas/Material" }
        floors: { type: [integer, "null"], minimum: 0, maximum: 50 }
        colour: { type: [string, "null"], maxLength: 30 }
        landmarkName: { type: [string, "null"], maxLength: 80, description: "Name of the building or a landmark; never a person's name" }

    Structure:
      allOf:
        - $ref: "#/components/schemas/StructureAttributes"
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, zoneId, status, code, centroid, source, version, needsVerification]
          properties:
            id: { type: string, format: uuid }
            zoneId: { type: string, format: uuid }
            code: { type: [string, "null"], description: "Null until issued after review" }
            status: { $ref: "#/components/schemas/StructureStatus" }
            footprint: { oneOf: [{ $ref: "#/components/schemas/Polygon" }, { type: "null" }] }
            centroid: { $ref: "#/components/schemas/Point" }
            source: { type: string, enum: [bootstrap, mapper] }
            bootstrapConfidence: { type: [number, "null"], minimum: 0, maximum: 1 }
            bootstrapOutcome: { type: [string, "null"], enum: [confirmed, adjusted, rejected, null] }
            mergedInto: { type: [string, "null"], format: uuid }
            needsVerification: { type: boolean }
            photoMissing: { type: boolean }
            lastVerified: { type: [string, "null"], format: date-time }
            verificationMethod: { oneOf: [{ $ref: "#/components/schemas/VerificationMethod" }, { type: "null" }] }
            version: { type: integer, description: "Increments on every change; used for review concurrency" }
            createdBy: { oneOf: [{ $ref: "#/components/schemas/Actor" }, { type: "null" }] }

    StructureDetail:
      allOf:
        - $ref: "#/components/schemas/Structure"
        - type: object
          required: [entrances, units, photoIds]
          properties:
            entrances: { type: array, items: { $ref: "#/components/schemas/Entrance" } }
            units: { type: array, items: { $ref: "#/components/schemas/Unit" } }
            photoIds: { type: array, items: { type: string, format: uuid } }

    StructureSearchHit:
      allOf:
        - $ref: "#/components/schemas/Structure"
        - type: object
          properties:
            distanceM: { type: number, description: "Present when searching near a point" }

    Entrance:
      type: object
      required: [id, structureId, label, isPrimary, location, routable, version]
      properties:
        id: { type: string, format: uuid }
        structureId: { type: string, format: uuid }
        label: { type: string, maxLength: 60 }
        isPrimary: { type: boolean }
        location: { $ref: "#/components/schemas/Point" }
        photoId: { type: [string, "null"], format: uuid }
        photoMissing: { type: boolean }
        routable: { type: boolean, description: "Against the latest published graph" }
        snapDistanceM: { type: [number, "null"] }
        version: { type: integer }

    Unit:
      type: object
      required: [id, structureId, number, status, version]
      properties:
        id: { type: string, format: uuid }
        structureId: { type: string, format: uuid }
        number: { type: integer, minimum: 1, maximum: 999 }
        label: { type: [string, "null"], maxLength: 60, description: "e.g. 'Room 12'; never an occupant's name" }
        doorPhotoId: { type: [string, "null"], format: uuid }
        entranceId: { type: [string, "null"], format: uuid, description: "Null means the building's primary entrance" }
        status: { type: string, enum: [active, merged, retired] }
        mergedInto: { type: [string, "null"], format: uuid }
        code: { type: [string, "null"], description: "Building code; address as `code / number`" }
        version: { type: integer }

    ServiceRecord:
      type: object
      required: [id, type, source, status]
      properties:
        id: { type: string, format: uuid }
        unitId: { type: [string, "null"], format: uuid }
        structureId: { type: [string, "null"], format: uuid }
        type: { type: string, enum: [water, electricity, sanitation, drainage, waste, other] }
        source: { type: string, maxLength: 40, description: "e.g. shared_tap, grid, shared_toilet" }
        supplyHours: { type: [number, "null"], minimum: 0, maximum: 24 }
        quality: { type: [string, "null"], enum: [good, fair, poor, none, null] }
        sharedWithCount: { type: [integer, "null"], minimum: 0 }
        status: { type: string, enum: [active, archived] }
        lastVerified: { type: [string, "null"], format: date-time }
        verificationMethod: { oneOf: [{ $ref: "#/components/schemas/VerificationMethod" }, { type: "null" }] }

    ServiceStats:
      type: object
      required: [zoneId, byType]
      properties:
        zoneId: { type: string, format: uuid }
        byType:
          type: array
          items:
            type: object
            required: [type, unitCount]
            properties:
              type: { type: string }
              unitCount: { type: integer }
              medianSupplyHours: { type: [number, "null"] }
              qualityCounts: { type: object, additionalProperties: { type: integer } }

    FieldChange:
      type: object
      required: [field, value, at, by, outcome]
      properties:
        field: { type: string }
        value: {}
        previousValue: {}
        at: { type: string, format: date-time, description: "Server receipt time" }
        capturedAt: { type: [string, "null"], format: date-time, description: "Device time, as reported" }
        by: { $ref: "#/components/schemas/Actor" }
        outcome: { type: string, enum: [applied, superseded, lost_conflict, sent_for_review] }

    RetiredCode:
      type: object
      required: [code, reason, retiredAt]
      properties:
        code: { type: string }
        reason: { type: string, enum: [merged, demolished, departed, other] }
        replacementCode: { type: [string, "null"] }
        retiredAt: { type: string, format: date-time }

    RetirementResult:
      type: object
      required: [structure, retiredCode, unboundBindingIds, warnedIncidentIds, cancelledTaskIds]
      properties:
        structure: { $ref: "#/components/schemas/Structure" }
        retiredCode: { oneOf: [{ $ref: "#/components/schemas/RetiredCode" }, { type: "null" }] }
        unboundBindingIds: { type: array, items: { type: string, format: uuid } }
        warnedIncidentIds: { type: array, items: { type: string, format: uuid } }
        cancelledTaskIds: { type: array, items: { type: string, format: uuid } }

    CodeLookupResult:
      type: object
      required: [status, code]
      properties:
        status: { type: string, enum: [active, retired] }
        code: { type: string, description: "Canonical form" }
        unitNumber: { type: [integer, "null"] }
        structure:
          description: Present only when active. A retired code never returns a location (ID-11).
          allOf: [{ $ref: "#/components/schemas/StructureDetail" }]
        unit:
          description: Present when a unit number was given and exists
          allOf: [{ $ref: "#/components/schemas/Unit" }]
        unitNotFound: { type: boolean, description: "A unit number was given but does not exist; the building is still returned" }
        retired: { $ref: "#/components/schemas/RetiredCode" }

    CodeCard:
      type: object
      required: [code, unitNumber, spokenForm, qrPayload]
      properties:
        code: { type: string }
        unitNumber: { type: integer }
        unitLabel: { type: [string, "null"] }
        spokenForm: { type: string, example: "Romeo Victor, Two Golf Kilo Nine, Nine, unit Two" }
        qrPayload: { type: string, description: "doorstep://code?c=RV-2GK9-9&u=2" }

    # ---------------------------------------------------------- photos
    PhotoKind:
      type: string
      enum: [building, entrance, unit, evidence]

    PhotoDeclaration:
      type: object
      required: [photoId, kind, sha256, sizeBytes, capturedAt]
      properties:
        photoId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/PhotoKind" }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        sizeBytes: { type: integer, minimum: 1 }
        capturedAt: { type: string, format: date-time }

    # ---------------------------------------------------------- sync
    SyncPushRequest:
      type: object
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/SyncOperation" }

    SyncOperation:
      type: object
      required: [clientOpId, seq, type, capturedAt, payload]
      properties:
        clientOpId: { type: string, format: uuid }
        seq: { type: integer, minimum: 1 }
        type: { $ref: "#/components/schemas/SyncOperationType" }
        capturedAt: { type: string, format: date-time, description: "Device time, as reported (never used for ordering)" }
        payload:
          description: Shape depends on `type`, as listed in `SyncPayloads`
          oneOf:
            - $ref: "#/components/schemas/OpStructureCreate"
            - $ref: "#/components/schemas/OpCandidateConfirm"
            - $ref: "#/components/schemas/OpCandidateReject"
            - $ref: "#/components/schemas/OpStructureUpdate"
            - $ref: "#/components/schemas/OpEntranceUpsert"
            - $ref: "#/components/schemas/OpUnitUpsert"
            - $ref: "#/components/schemas/OpServiceRecordUpsert"
            - $ref: "#/components/schemas/OpServiceRecordVerify"
            - $ref: "#/components/schemas/OpTraceSubmit"
            - $ref: "#/components/schemas/OpPhotoAttach"
            - $ref: "#/components/schemas/OpTaskComplete"
            - $ref: "#/components/schemas/OpGrievanceCreate"

    SyncOperationType:
      type: string
      description: |
        structure.create → OpStructureCreate; candidate.confirm → OpCandidateConfirm;
        candidate.reject → OpCandidateReject; structure.update → OpStructureUpdate;
        entrance.upsert → OpEntranceUpsert; unit.upsert → OpUnitUpsert;
        service_record.upsert → OpServiceRecordUpsert; service_record.verify → OpServiceRecordVerify;
        trace.submit → OpTraceSubmit; photo.attach → OpPhotoAttach; task.complete → OpTaskComplete;
        grievance.create → OpGrievanceCreate. Consent is never a sync operation (PV-05).
      enum:
        - structure.create
        - candidate.confirm
        - candidate.reject
        - structure.update
        - entrance.upsert
        - unit.upsert
        - service_record.upsert
        - service_record.verify
        - trace.submit
        - photo.attach
        - task.complete
        - grievance.create

    OpStructureCreate:
      type: object
      description: A new building the mapper dropped (no candidate chosen). May raise a duplicate candidate (ID-02).
      required: [structureId, zoneId, pin]
      allOf: [{ $ref: "#/components/schemas/StructureAttributes" }]
      properties:
        structureId: { type: string, format: uuid }
        zoneId: { type: string, format: uuid }
        pin: { $ref: "#/components/schemas/Fix" }
        footprint: { $ref: "#/components/schemas/Polygon" }
        photoMissing: { type: boolean, default: false }

    OpCandidateConfirm:
      type: object
      description: Mapper confirms a bootstrap candidate, optionally with an adjusted footprint (ID-02, GP-08)
      required: [structureId]
      allOf: [{ $ref: "#/components/schemas/StructureAttributes" }]
      properties:
        structureId: { type: string, format: uuid }
        adjustedFootprint: { $ref: "#/components/schemas/Polygon" }
        photoMissing: { type: boolean, default: false }

    OpCandidateReject:
      type: object
      required: [structureId, reason]
      properties:
        structureId: { type: string, format: uuid }
        reason: { type: string, enum: [no_building, wrong_shape, duplicate_of_other, other] }
        note: { type: string, maxLength: 300 }

    OpStructureUpdate:
      type: object
      description: Field-level edit. `baseVersion` is the version the device last saw; conflicts per field are resolved by server receipt order and the loser is kept in history and flagged (SY-05).
      required: [structureId, baseVersion, fields]
      properties:
        structureId: { type: string, format: uuid }
        baseVersion: { type: integer }
        fields: { $ref: "#/components/schemas/StructureAttributes" }
        footprint: { $ref: "#/components/schemas/Polygon" }

    OpEntranceUpsert:
      type: object
      required: [entranceId, structureId, label, isPrimary, location]
      properties:
        entranceId: { type: string, format: uuid }
        structureId: { type: string, format: uuid }
        baseVersion: { type: integer, description: "Omit when creating" }
        label: { type: string, maxLength: 60 }
        isPrimary: { type: boolean }
        location: { $ref: "#/components/schemas/Fix" }
        photoMissing: { type: boolean, default: false }

    OpUnitUpsert:
      type: object
      required: [unitId, structureId, number]
      properties:
        unitId: { type: string, format: uuid }
        structureId: { type: string, format: uuid }
        baseVersion: { type: integer }
        number: { type: integer, minimum: 1, maximum: 999 }
        label: { type: [string, "null"], maxLength: 60 }
        entranceId: { type: [string, "null"], format: uuid }

    OpServiceRecordUpsert:
      type: object
      required: [serviceRecordId, type, source]
      properties:
        serviceRecordId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        structureId: { type: string, format: uuid }
        type: { type: string, enum: [water, electricity, sanitation, drainage, waste, other] }
        source: { type: string, maxLength: 40 }
        supplyHours: { type: [number, "null"], minimum: 0, maximum: 24 }
        quality: { type: [string, "null"], enum: [good, fair, poor, none, null] }
        sharedWithCount: { type: [integer, "null"], minimum: 0 }

    OpServiceRecordVerify:
      type: object
      description: The cheap "still true?" re-check
      required: [serviceRecordId, stillTrue]
      properties:
        serviceRecordId: { type: string, format: uuid }
        stillTrue: { type: boolean }

    OpTraceSubmit:
      type: object
      description: A whole walk. `complete:false` marks an interrupted walk (GP-04). Gaps are recorded, never interpolated (GP-03).
      required: [traceId, zoneId, purpose, startedAt, complete, fixes]
      properties:
        traceId: { type: string, format: uuid }
        zoneId: { type: string, format: uuid }
        purpose: { type: string, enum: [walk, evidence] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        complete: { type: boolean }
        startAccessPointId: { type: [string, "null"], format: uuid }
        endEntranceId: { type: [string, "null"], format: uuid }
        fixes: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/Fix" } }
        gaps:
          type: array
          items:
            type: object
            required: [from, to]
            properties:
              from: { type: string, format: date-time }
              to: { type: string, format: date-time }

    OpPhotoAttach:
      type: object
      description: Declares a photo and its owner. Bytes follow via PUT /photos/{photoId} (records sync before photos).
      required: [ownerType, ownerId, photo]
      properties:
        ownerType: { type: string, enum: [structure, entrance, unit, task, grievance] }
        ownerId: { type: string, format: uuid }
        photo: { $ref: "#/components/schemas/PhotoDeclaration" }

    OpTaskComplete:
      type: object
      required: [taskId, result]
      properties:
        taskId: { type: string, format: uuid }
        result: { type: string, enum: [verified_unchanged, corrected, not_found, demolished, could_not_visit] }
        note: { type: string, maxLength: 1000 }
        position: { $ref: "#/components/schemas/Fix" }
        evidencePhotoIds: { type: array, items: { type: string, format: uuid } }

    OpGrievanceCreate:
      type: object
      description: Mapper files a report on a resident's behalf
      required: [grievanceId, input]
      properties:
        grievanceId: { type: string, format: uuid }
        input: { $ref: "#/components/schemas/GrievanceInput" }

    SyncOpResult:
      type: object
      required: [clientOpId, seq, status]
      properties:
        clientOpId: { type: string, format: uuid }
        seq: { type: integer }
        status: { type: string, enum: [applied, duplicate, rejected, sent_for_review, deferred] }
        entityVersion: { type: integer }
        conflicts:
          type: array
          description: Fields where this edit lost to a later-received one (SY-05)
          items: { type: string }
        editReviewId: { type: string, format: uuid, description: "When status is sent_for_review (SY-06)" }
        duplicateCandidateId: { type: string, format: uuid, description: "When the capture raised a duplicate candidate" }
        error: { $ref: "#/components/schemas/Error" }

    SyncPushResponse:
      type: object
      required: [results, nextExpectedSeq]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/SyncOpResult" } }
        nextExpectedSeq: { type: integer }

    SyncChange:
      type: object
      required: [cursor, entityType, entityId, action]
      properties:
        cursor: { type: string }
        entityType: { type: string, enum: [zone, access_point, structure, entrance, unit, service_record, task, retired_code, photo] }
        entityId: { type: string }
        action: { type: string, enum: [upsert, archive] }
        data:
          description: Full current entity for upsert; absent for archive
          oneOf:
            - $ref: "#/components/schemas/Zone"
            - $ref: "#/components/schemas/AccessPoint"
            - $ref: "#/components/schemas/Structure"
            - $ref: "#/components/schemas/Entrance"
            - $ref: "#/components/schemas/Unit"
            - $ref: "#/components/schemas/ServiceRecord"
            - $ref: "#/components/schemas/VerificationTask"
            - $ref: "#/components/schemas/RetiredCode"

    SyncPullResponse:
      type: object
      required: [changes, nextCursor, hasMore]
      properties:
        changes: { type: array, items: { $ref: "#/components/schemas/SyncChange" } }
        nextCursor: { type: string }
        hasMore: { type: boolean }

    DevicePendingCounts:
      type: object
      required: [pendingOps, pendingPhotos, pendingConsents]
      properties:
        pendingOps: { type: integer, minimum: 0 }
        pendingPhotos: { type: integer, minimum: 0 }
        pendingConsents: { type: integer, minimum: 0 }
        reportedAt: { type: string, format: date-time }

    SyncStatus:
      type: object
      required: [deviceStatus, lastAppliedSeq, serverCursor]
      properties:
        deviceStatus: { type: string, enum: [active, revoked] }
        lastAppliedSeq: { type: integer }
        serverCursor: { type: string, description: "Latest cursor for this device's zones" }

    # ---------------------------------------------------------- review
    ReviewLane:
      type: string
      enum: [clear, duplicate]

    ReviewItem:
      type: object
      required: [structure, lane, state, duplicateCandidateIds, syncedAt]
      properties:
        structure: { $ref: "#/components/schemas/StructureDetail" }
        lane: { $ref: "#/components/schemas/ReviewLane" }
        state: { type: string, enum: [open, deferred] }
        duplicateCandidateIds: { type: array, items: { type: string, format: uuid } }
        syncedAt: { type: string, format: date-time }
        capturedByMe: { type: boolean, description: "True when the caller captured it; approve is disabled (AC-03)" }

    DuplicateSignal:
      type: object
      required: [kind, value]
      properties:
        kind: { type: string, enum: [proximity, footprint_overlap, attribute_match, same_candidate] }
        value: { type: number }
        unit: { type: string, enum: [m, ratio, score] }

    DuplicateCandidateDetail:
      type: object
      required: [id, structureA, structureB, signals, decision, version]
      properties:
        id: { type: string, format: uuid }
        structureA: { $ref: "#/components/schemas/StructureDetail" }
        structureB: { $ref: "#/components/schemas/StructureDetail" }
        signals: { type: array, items: { $ref: "#/components/schemas/DuplicateSignal" } }
        decision: { type: [string, "null"], enum: [merge, distinct, defer, null] }
        decidedBy: { oneOf: [{ $ref: "#/components/schemas/Actor" }, { type: "null" }] }
        decidedAt: { type: [string, "null"], format: date-time }
        version: { type: integer }

    DuplicateDecisionRequest:
      type: object
      required: [decision, version]
      properties:
        decision: { type: string, enum: [merge, distinct, defer] }
        survivorId: { type: string, format: uuid, description: "Required for merge" }
        version: { type: integer, description: "Candidate version the reviewer looked at" }
        note: { type: string, maxLength: 500 }

    DuplicateDecisionResult:
      type: object
      required: [candidate]
      properties:
        candidate: { $ref: "#/components/schemas/DuplicateCandidateDetail" }
        survivorId: { type: string, format: uuid }
        retiredCode: { $ref: "#/components/schemas/RetiredCode" }
        movedUnitIds: { type: array, items: { type: string, format: uuid } }
        movedEntranceIds: { type: array, items: { type: string, format: uuid } }
        movedBindingIds: { type: array, items: { type: string, format: uuid } }

    ApprovalResult:
      type: object
      required: [structureId, status]
      properties:
        structureId: { type: string, format: uuid }
        status: { type: string, enum: [issued, failed] }
        code: { type: string }
        error: { $ref: "#/components/schemas/Error" }

    EditReview:
      type: object
      required: [id, kind, structureId, state, submittedBy, submittedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [field_conflict, edit_on_merged, edit_on_retired] }
        structureId: { type: string, format: uuid, description: "Surviving or retired record the edit is attached to" }
        originalTargetId: { type: string, format: uuid }
        field: { type: [string, "null"] }
        proposedValue: {}
        currentValue: {}
        state: { type: string, enum: [open, resolved] }
        decision: { type: [string, "null"], enum: [apply, keep_current, dismiss, null] }
        submittedBy: { $ref: "#/components/schemas/Actor" }
        submittedAt: { type: string, format: date-time }

    # ---------------------------------------------------------- graph
    GraphVersionStatus:
      type: string
      enum: [building, failed, draft, published, superseded]

    GraphVersionCreate:
      type: object
      required: [zoneId, mode]
      properties:
        zoneId: { type: string, format: uuid }
        mode: { type: string, enum: [build, copy] }
        baseVersionId: { type: string, format: uuid, description: "Required for copy" }
        params: { type: object, additionalProperties: true, description: "Engine parameters; recorded on the version" }

    GraphVersion:
      type: object
      required: [id, zoneId, number, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        zoneId: { type: string, format: uuid }
        number: { type: integer, description: "Human-facing version number per zone" }
        status: { $ref: "#/components/schemas/GraphVersionStatus" }
        baseVersionId: { type: [string, "null"], format: uuid }
        traceCount: { type: integer }
        fixesUsed: { type: integer }
        fixesFilteredLowAccuracy: { type: integer }
        params: { type: object, additionalProperties: true }
        metrics: { type: object, additionalProperties: { type: number }, description: "e.g. nodeCount, edgeCount, components, routableEntrances" }
        removedEdgeIds: { type: array, items: { type: string } }
        failureReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        publishedAt: { type: [string, "null"], format: date-time }
        createdBy: { $ref: "#/components/schemas/Actor" }

    GraphStatus:
      type: object
      required: [zoneId, newTracesSinceLastBuild, buildInProgress]
      properties:
        zoneId: { type: string, format: uuid }
        published: { oneOf: [{ $ref: "#/components/schemas/GraphVersion" }, { type: "null" }] }
        latestDraft: { oneOf: [{ $ref: "#/components/schemas/GraphVersion" }, { type: "null" }] }
        newTracesSinceLastBuild: { type: integer }
        buildInProgress: { type: boolean }

    GraphEdgeCollection:
      type: object
      required: [type, features]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type: { type: string, const: Feature }
              id: { type: string }
              geometry: { $ref: "#/components/schemas/LineString" }
              properties:
                type: object
                required: [supportCount, provenance, lengthM]
                properties:
                  supportCount: { type: integer, description: "Number of distinct traces supporting the edge" }
                  provenance: { type: string, enum: [trace_backbone, map_matched, bridge] }
                  lengthM: { type: number }

    Snap:
      type: object
      required: [targetType, targetId, routable, distanceM]
      properties:
        targetType: { type: string, enum: [entrance, access_point] }
        targetId: { type: string, format: uuid }
        routable: { type: boolean }
        distanceM: { type: number }
        nodeId: { type: [string, "null"] }
        wasRoutableInPublished: { type: boolean }

    TraceSummary:
      type: object
      required: [id, zoneId, purpose, complete, fixCount, startedAt, mapper]
      properties:
        id: { type: string, format: uuid }
        zoneId: { type: string, format: uuid }
        purpose: { type: string, enum: [walk, evidence] }
        complete: { type: boolean }
        fixCount: { type: integer }
        lowAccuracyFixCount: { type: integer }
        startedAt: { type: string, format: date-time }
        mapper: { $ref: "#/components/schemas/Actor" }

    Trace:
      allOf:
        - $ref: "#/components/schemas/TraceSummary"
        - type: object
          required: [fixes]
          properties:
            fixes: { type: array, items: { $ref: "#/components/schemas/Fix" } }
            gaps:
              type: array
              items:
                type: object
                properties:
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }

    RouteRequest:
      type: object
      required: [target]
      properties:
        originAccessPointId: { type: string, format: uuid, description: "Omit to use the nearest access point (warning ORIGIN_DEFAULTED)" }
        target:
          type: object
          description: Exactly one of entranceId, unitId, structureId
          minProperties: 1
          maxProperties: 1
          properties:
            entranceId: { type: string, format: uuid }
            unitId: { type: string, format: uuid }
            structureId: { type: string, format: uuid }
        graphVersionId: { type: string, format: uuid, description: "Pin a version (e.g. to reproduce a route)" }
        incidentId: { type: string, format: uuid, description: "Pin the route to this incident" }

    RouteWarning:
      type: string
      enum: [NO_ENTRANCE_MAPPED, ORIGIN_DEFAULTED, NEWER_GRAPH_AVAILABLE, TARGET_ENTRANCE_UNVERIFIED]

    Route:
      type: object
      required: [id, graphVersionId, originAccessPointId, target, approximate, warnings, geometry, steps, distanceM, computedAt]
      properties:
        id: { type: string, format: uuid }
        graphVersionId: { type: string, format: uuid }
        graphVersionNumber: { type: integer }
        originAccessPointId: { type: string, format: uuid }
        target:
          type: object
          required: [structureId, endPoint]
          properties:
            structureId: { type: string, format: uuid }
            unitId: { type: [string, "null"], format: uuid }
            entranceId: { type: [string, "null"], format: uuid }
            endPoint: { $ref: "#/components/schemas/Point" }
        approximate: { type: boolean }
        warnings: { type: array, items: { $ref: "#/components/schemas/RouteWarning" } }
        geometry: { $ref: "#/components/schemas/LineString" }
        steps:
          type: array
          items:
            type: object
            required: [instruction, distanceM, at]
            properties:
              instruction: { type: string }
              distanceM: { type: number }
              at: { $ref: "#/components/schemas/Point" }
        distanceM: { type: number }
        estimatedWalkSeconds: { type: integer }
        computedAt: { type: string, format: date-time }
        newerGraphVersionId: { type: [string, "null"], format: uuid, description: "Set when a newer version has been published since (GR-04)" }

    # ---------------------------------------------------------- tasks & evidence
    TaskPriority:
      type: integer
      description: "1 dispatch failure, 2 confirmed/corroborated grievance or field mismatch, 3 imagery, 4 stale or reminder"
      enum: [1, 2, 3, 4]

    TaskStatus:
      type: string
      enum: [open, assigned, done, dismissed]

    TaskReason:
      type: string
      enum: [dispatch_failure, reached_elsewhere, grievance, imagery_change, stale, photo_missing, unroutable_entrance, graph_problem, structure_retired]

    VerificationTask:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, zoneId, target, reason, priority, status, evidence]
          properties:
            id: { type: string, format: uuid }
            zoneId: { type: string, format: uuid }
            target:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [structure, entrance, unit, zone_cell, graph] }
                id: { type: [string, "null"], format: uuid }
                cell: { $ref: "#/components/schemas/Polygon" }
            reason: { $ref: "#/components/schemas/TaskReason" }
            priority: { $ref: "#/components/schemas/TaskPriority" }
            status: { $ref: "#/components/schemas/TaskStatus" }
            assigneeId: { type: [string, "null"], format: uuid }
            evidence: { type: array, items: { $ref: "#/components/schemas/EvidenceEvent" } }
            warning: { type: [string, "null"], enum: [target_retired, target_merged, null] }
            result: { type: [string, "null"] }

    EvidenceSourceType:
      type: string
      description: "Weights: dispatch_outcome 1.0, corroborated_report 0.7, mapper_observation 0.6, imagery_candidate 0.4, single_report 0.1"
      enum: [dispatch_outcome, corroborated_report, mapper_observation, imagery_candidate, single_report]

    EvidenceInput:
      type: object
      required: [sourceType]
      properties:
        sourceType: { $ref: "#/components/schemas/EvidenceSourceType" }
        note: { type: string, maxLength: 1000 }
        photoIds: { type: array, items: { type: string, format: uuid } }
        position: { $ref: "#/components/schemas/Fix" }
        refType: { type: string, enum: [incident, assignment, grievance, imagery_run, task] }
        refId: { type: string, format: uuid }

    EvidenceEvent:
      allOf:
        - $ref: "#/components/schemas/EvidenceInput"
        - type: object
          required: [id, weight, createdAt]
          properties:
            id: { type: string, format: uuid }
            weight: { type: number }
            createdAt: { type: string, format: date-time }

    # ---------------------------------------------------------- grievances
    GrievanceStatus:
      type: string
      enum: [received, corroborating, confirmed, rejected]

    GrievanceCategory:
      type: string
      enum: [wrong_location, structure_changed, demolished, entrance_wrong, service_issue, removal_request, other]

    GrievanceInput:
      type: object
      required: [category]
      properties:
        target:
          type: object
          description: Exactly one. Residents may omit target to mean their claimed unit.
          maxProperties: 1
          properties:
            unitId: { type: string, format: uuid }
            structureId: { type: string, format: uuid }
            code: { type: string }
        category: { $ref: "#/components/schemas/GrievanceCategory" }
        text: { type: string, maxLength: 1000, description: "Shown with a warning not to include names or phone numbers" }
        position: { $ref: "#/components/schemas/Fix" }
        photo: { $ref: "#/components/schemas/PhotoDeclaration" }

    Grievance:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, source, status, category, weight, locationMismatch]
          properties:
            id: { type: string, format: uuid }
            source: { type: string, enum: [resident, mapper, public] }
            structureId: { type: [string, "null"], format: uuid }
            unitId: { type: [string, "null"], format: uuid }
            category: { $ref: "#/components/schemas/GrievanceCategory" }
            text: { type: [string, "null"] }
            position: { oneOf: [{ $ref: "#/components/schemas/Fix" }, { type: "null" }] }
            photoId: { type: [string, "null"], format: uuid }
            photoPending: { type: boolean }
            status: { $ref: "#/components/schemas/GrievanceStatus" }
            weight: { type: number, description: "Accumulated evidence weight" }
            locationMismatch: { type: boolean, description: "Report position far from the structure (GV-02)" }
            corroboratedBy: { type: array, items: { type: string, format: uuid } }
            taskId: { type: [string, "null"], format: uuid }

    PublicReportInput:
      type: object
      required: [code, category]
      properties:
        code: { type: string, description: "Forgiving input; invalid or retired codes get a specific 422/404 (GV-05)" }
        category: { $ref: "#/components/schemas/GrievanceCategory" }
        text: { type: string, maxLength: 1000 }
        position: { $ref: "#/components/schemas/Fix" }
        photo: { $ref: "#/components/schemas/PhotoDeclaration" }

    # ---------------------------------------------------------- incidents
    IncidentStatus:
      type: string
      enum: [new, claimed, located, assigned, reached, failed, cancelled, closed]

    IncidentFlag:
      type: string
      enum:
        - position_unavailable          # DS-06
        - far_from_registered_location  # DS-07
        - registered_location_retired   # DS-08
        - lock_taken_over               # DS-10
        - public_address_changed        # DS-17
        - consent_withdrawn_during      # PV-03

    IncidentLock:
      type: object
      required: [holder, acquiredAt, expiresAt]
      properties:
        holder: { $ref: "#/components/schemas/Actor" }
        acquiredAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    IncidentSummary:
      type: object
      required: [id, source, status, flags, createdAt, acknowledged]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, description: "Human-facing incident number" }
        source: { type: string, enum: [sos, call, manual] }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        acknowledged: { type: boolean }
        acknowledgedAt: { type: [string, "null"], format: date-time }
        escalationLevel: { type: integer, minimum: 0 }
        lock: { oneOf: [{ $ref: "#/components/schemas/IncidentLock" }, { type: "null" }] }
        code: { type: [string, "null"] }
        unitNumber: { type: [integer, "null"] }
        flags: { type: array, items: { $ref: "#/components/schemas/IncidentFlag" } }
        createdAt: { type: string, format: date-time }

    IncidentLocationInput:
      type: object
      required: [method, structureId]
      properties:
        method: { $ref: "#/components/schemas/LocateMethod" }
        structureId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        entranceId: { type: string, format: uuid }
        locationShareId: { type: string, format: uuid }

    LocateMethod:
      type: string
      enum: [sos_registered, code, location_share, search]

    Incident:
      allOf:
        - $ref: "#/components/schemas/IncidentSummary"
        - type: object
          required: [timeline, routes, assignments, locationShares]
          properties:
            location:
              type: [object, "null"]
              properties:
                method: { $ref: "#/components/schemas/LocateMethod" }
                structureId: { type: string, format: uuid }
                unitId: { type: [string, "null"], format: uuid }
                entranceId: { type: [string, "null"], format: uuid }
                point: { $ref: "#/components/schemas/Point" }
                locatedAt: { type: string, format: date-time }
            sosPosition: { oneOf: [{ $ref: "#/components/schemas/Fix" }, { type: "null" }] }
            sosDistanceFromUnitM: { type: [number, "null"] }
            note: { type: [string, "null"] }
            routes: { type: array, description: "Routes pinned to this incident, newest first", items: { $ref: "#/components/schemas/Route" } }
            assignments: { type: array, items: { $ref: "#/components/schemas/ResponderAssignment" } }
            locationShares: { type: array, items: { $ref: "#/components/schemas/LocationShare" } }
            outcome: { type: [string, "null"], enum: [reached, failed, null] }
            cancelReason: { type: [string, "null"] }
            timeline: { type: array, items: { $ref: "#/components/schemas/TimelineEntry" } }

    TimelineEntry:
      type: object
      required: [at, kind, actor]
      properties:
        at: { type: string, format: date-time, description: "Server time" }
        kind:
          type: string
          enum: [created, acknowledged, escalated, claimed, released, taken_over, located, routed, location_share_sent,
                 location_received, assigned, assignment_revoked, outcome_reported, occupant_context_viewed, cancelled, closed]
        actor: { $ref: "#/components/schemas/Actor" }
        reportedAt: { type: [string, "null"], format: date-time, description: "Device time, e.g. when a queued outcome was pressed (DS-16)" }
        details: { type: object, additionalProperties: true, description: "Never personal data" }

    OccupantContext:
      type: object
      required: [status, occupants, checkedAt]
      properties:
        status: { type: string, enum: [granted, none_granted, vault_unavailable, not_located] }
        occupants:
          type: array
          description: One entry per persona with at least one granted scope. Fields appear only if their scope is granted.
          items:
            type: object
            properties:
              name: { type: string }
              phone: { type: string }
              notes: { type: string }
              grantedScopes: { type: array, items: { $ref: "#/components/schemas/ConsentScope" } }
        checkedAt: { type: string, format: date-time }

    LocationShare:
      type: object
      required: [id, status, expiresAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri, description: "Only returned to the dispatcher who created it" }
        qrPayload: { type: string }
        status: { type: string, enum: [active, expired, revoked] }
        expiresAt: { type: string, format: date-time }
        positions:
          type: array
          items:
            type: object
            required: [receivedAt, resubmission]
            properties:
              position: { $ref: "#/components/schemas/Fix" }
              landmarkText: { type: [string, "null"] }
              receivedAt: { type: string, format: date-time }
              resubmission: { type: boolean }
        issuedForBaseUrl: { type: string, description: "Public address at issue time; differs from current after a tunnel restart (DS-17)" }

    ResponderAssignment:
      type: object
      required: [id, incidentId, responderLabel, status, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        incidentId: { type: string, format: uuid }
        responderLabel: { type: string }
        url: { type: string, format: uri, description: "Responder link; share sheet / QR / copy" }
        qrPayload: { type: string }
        status: { type: string, enum: [active, revoked, ended] }
        expiresAt: { type: string, format: date-time }
        outcome: { type: [string, "null"], enum: [reached, couldnt_find, null] }
        outcomeAt: { type: [string, "null"], format: date-time }
        outcomePressedAt: { type: [string, "null"], format: date-time }
        outcomeNote: { type: [string, "null"] }
        outcomePosition: { oneOf: [{ $ref: "#/components/schemas/Fix" }, { type: "null" }] }
        outcomePhotoIds: { type: array, items: { type: string, format: uuid } }
        replacesAssignmentId: { type: [string, "null"], format: uuid }
        issuedForBaseUrl: { type: string }
        createdAt: { type: string, format: date-time }

    ResponderView:
      type: object
      required: [incidentNumber, code, route, outcomeRecorded]
      properties:
        incidentNumber: { type: integer }
        code: { type: string }
        unitNumber: { type: [integer, "null"] }
        unitLabel: { type: [string, "null"] }
        entranceLabel: { type: [string, "null"] }
        hasEntrancePhoto: { type: boolean }
        route:
          description: Null when routing refused; `routeUnavailableReason` says why and `destination` still shows where
          oneOf: [{ $ref: "#/components/schemas/Route" }, { type: "null" }]
        routeUnavailableReason: { type: [string, "null"], enum: [OUTSIDE_NETWORK, NO_ROUTE, NO_GRAPH_PUBLISHED, null] }
        destination: { $ref: "#/components/schemas/Point" }
        outcomeRecorded: { type: [string, "null"], enum: [reached, couldnt_find, null] }
        expiresAt: { type: string, format: date-time }

    ResponderOutcomeInput:
      type: object
      required: [outcome, pressedAt]
      properties:
        outcome: { type: string, enum: [reached, couldnt_find] }
        pressedAt: { type: string, format: date-time, description: "When the button was pressed (may be earlier than receipt, DS-16)" }
        note: { type: string, maxLength: 1000 }
        tags: { type: array, items: { type: string, enum: [path_problem, wrong_entrance, structure_missing, access_blocked] } }
        position: { $ref: "#/components/schemas/Fix" }
        photos: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/PhotoDeclaration" } }

    # ---------------------------------------------------------- consent
    ConsentScope:
      type: string
      enum: [name, phone, notes]
      description: "name/phone/notes to dispatch"

    ConsentCaptureRequest:
      type: object
      required: [unitId, scopes, method, capturedAt, persona]
      properties:
        unitId: { type: string, format: uuid }
        persona:
          type: object
          description: Only fields whose scope is granted are accepted
          properties:
            name: { type: string, maxLength: 80 }
            phone: { type: string, maxLength: 20 }
            notes: { type: string, maxLength: 500 }
        scopes: { type: array, minItems: 1, uniqueItems: true, items: { $ref: "#/components/schemas/ConsentScope" } }
        method: { type: string, enum: [in_person_verbal, in_person_written] }
        capturedAt: { type: string, format: date-time }

    ConsentSummary:
      type: object
      required: [consentId, personaRef, scope, status, capturedAt]
      properties:
        consentId: { type: string, format: uuid }
        personaRef: { type: string, format: uuid, description: "Opaque; lets one person's scopes be grouped" }
        scope: { $ref: "#/components/schemas/ConsentScope" }
        status: { type: string, enum: [granted, withdrawn] }
        capturedAt: { type: string, format: date-time }
        withdrawnAt: { type: [string, "null"], format: date-time }

    ConsentWithdrawalRequest:
      type: object
      required: [personaRef]
      properties:
        personaRef: { type: string, format: uuid }
        scopes: { type: array, items: { $ref: "#/components/schemas/ConsentScope" }, description: "Omit to withdraw all" }
        deleteIdentity: { type: boolean, default: false, description: "Delete the persona's identity from the vault (PV-07)" }

    ConsentWithdrawalResult:
      type: object
      required: [withdrawnConsentIds, identityDeleted]
      properties:
        withdrawnConsentIds: { type: array, items: { type: string, format: uuid } }
        identityDeleted: { type: boolean }

    # ---------------------------------------------------------- live events
    LiveEventType:
      type: string
      enum:
        - incident.created
        - incident.updated
        - incident.escalated
        - incident.lock_changed
        - incident.location_received
        - incident.outcome_reported
        - review.item_added
        - review.item_decided
        - edit_review.added
        - graph.build_finished
        - graph.published
        - task.created
        - task.updated
        - grievance.updated
        - system.public_address_changed
        - system.health_changed
        - system.demo_reset

    LiveEvent:
      type: object
      description: |
        `cursor` is strictly increasing across the deployment, with no reuse. `data` carries IDs and
        status only (clients fetch details by REST); it never carries personal data.
      required: [cursor, type, occurredAt, data]
      properties:
        cursor: { type: integer, format: int64 }
        type: { $ref: "#/components/schemas/LiveEventType" }
        occurredAt: { type: string, format: date-time }
        data:
          type: object
          additionalProperties: true
          properties:
            incidentId: { type: string, format: uuid }
            structureId: { type: string, format: uuid }
            taskId: { type: string, format: uuid }
            versionId: { type: string, format: uuid }
            grievanceId: { type: string, format: uuid }
            status: { type: string }
            escalationLevel: { type: integer }
            publicBaseUrl: { type: string }
            affectedIncidentIds: { type: array, items: { type: string, format: uuid } }
            components: { type: object, additionalProperties: { type: string } }

    LiveServerMessage:
      description: Messages the server sends on the WebSocket
      oneOf:
        - type: object
          required: [type, serverCursor, replayFrom]
          properties:
            type: { type: string, const: hello }
            serverCursor: { type: integer, format: int64 }
            replayFrom: { type: integer, format: int64 }
        - type: object
          required: [type, event]
          properties:
            type: { type: string, const: event }
            event: { $ref: "#/components/schemas/LiveEvent" }
        - type: object
          required: [type]
          properties:
            type: { type: string, const: ping }

    # ---------------------------------------------------------- imagery
    ImageryCell:
      type: object
      required: [cell, signals, rank]
      properties:
        cell: { $ref: "#/components/schemas/Polygon" }
        signals: { type: array, minItems: 1, items: { type: string, enum: [baseline, recent] } }
        baselineDelta: { type: [number, "null"], description: "Change in building presence/count across the baseline years" }
        recentScore: { type: [number, "null"], description: "Built-up change measure from Sentinel-2 composites" }
        rank: { type: number, description: "Higher first; both-signal cells rank above one-signal cells (IM-06)" }

    ImageryRunInput:
      type: object
      required: [runKey, zoneId, baseline, recent, cells]
      properties:
        runKey: { type: string, description: "Stable per zone + period, e.g. 'RV:2026-Q4'. Repeats are no-ops (IM-02)." }
        zoneId: { type: string, format: uuid }
        baseline:
          type: object
          required: [years, ran]
          properties:
            years: { type: array, items: { type: integer } }
            ran: { type: boolean }
        recent:
          type: object
          required: [ran]
          properties:
            ran: { type: boolean }
            recentWindow: { type: string, description: "ISO interval" }
            earlierWindow: { type: string, description: "ISO interval, same season (IM-05)" }
            season: { type: string }
            skippedReason: { type: [string, "null"], description: "e.g. too few cloud-free scenes (IM-04)" }
        threshold: { type: number }
        cells: { type: array, items: { $ref: "#/components/schemas/ImageryCell" } }

    ImageryRun:
      allOf:
        - $ref: "#/components/schemas/ImageryRunInput"
        - type: object
          required: [id, importedAt, createdTaskIds, updatedTaskIds]
          properties:
            id: { type: string, format: uuid }
            importedAt: { type: string, format: date-time }
            createdTaskIds: { type: array, items: { type: string, format: uuid } }
            updatedTaskIds: { type: array, items: { type: string, format: uuid } }

    # ---------------------------------------------------------- admin
    AuditEntry:
      type: object
      required: [id, at, actor, action]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actor: { $ref: "#/components/schemas/Actor" }
        action: { type: string, example: "incident.lock_taken_over" }
        targetType: { type: string }
        targetId: { type: string }
        details: { type: object, additionalProperties: true, description: "Never personal data" }

    PublicAddress:
      type: object
      required: [baseUrl, since, qrPayload]
      properties:
        baseUrl: { type: string, format: uri }
        since: { type: string, format: date-time }
        qrPayload: { type: string, description: "doorstep://server?u=<baseUrl>" }

    Health:
      type: object
      required: [status, components, checkedAt]
      properties:
        status: { type: string, enum: [ok, degraded] }
        components:
          type: object
          required: [registryDb, vault, photoStore, worker]
          properties:
            registryDb: { $ref: "#/components/schemas/ComponentHealth" }
            vault: { $ref: "#/components/schemas/ComponentHealth" }
            photoStore: { $ref: "#/components/schemas/ComponentHealth" }
            worker: { $ref: "#/components/schemas/ComponentHealth" }
            tunnel: { $ref: "#/components/schemas/ComponentHealth" }
        checkedAt: { type: string, format: date-time }

    ComponentHealth:
      type: string
      enum: [up, down, unknown]
